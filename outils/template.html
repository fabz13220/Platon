<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:U;src:url(file:///home/claude/fonts/package/files/unbounded-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:U;src:url(file:///home/claude/fonts/package/files/unbounded-latin-900-normal.woff2);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:U,sans-serif;font-weight:800}
#bg{position:absolute;inset:-200px;background:linear-gradient(135deg,#ffa63d 0%,#ff4f7b 30%,#ff2d8a 55%,#c42bd6 80%,#6a2bff 100%)}
#glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,90,.55),rgba(255,200,90,0) 70%);left:-300px;top:-300px}
#top{position:absolute;top:50px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px}
.logo{width:74px;height:74px;border-radius:20px;background:linear-gradient(140deg,#ff9a4a,#ff2d8a 55%,#7b2bff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:42px;box-shadow:0 6px 18px rgba(80,0,60,.35)}
#count{background:rgba(60,0,40,.38);color:#fff;font-size:34px;padding:12px 24px;border-radius:40px;font-weight:900}
#text{position:absolute;top:530px;left:70px;right:70px;text-align:center;color:#fff;font-size:92px;line-height:1.12;text-shadow:0 6px 0 rgba(120,0,70,.18)}
.w{display:inline-block;margin:0 .13em;transform-origin:50% 80%}
.box{display:inline-block;background:#fff;color:#ff2d8a;padding:4px 26px 10px;border-radius:18px;margin-top:14px;text-shadow:none;box-shadow:0 10px 28px rgba(90,0,60,.25)}
#btns{position:absolute;top:1230px;left:0;right:0;display:flex;justify-content:center;gap:34px}
.btn{width:400px;height:190px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:46px;font-weight:900}
.btn .e{font-size:60px;line-height:1}
#yes{background:#fff;color:#ff2d8a;box-shadow:0 12px 30px rgba(90,0,60,.3)}
#no{background:#1a0b2e;color:#fff;box-shadow:0 12px 30px rgba(20,0,40,.35)}
#bar{position:absolute;top:1470px;left:270px;width:540px;height:14px;border-radius:7px;background:rgba(255,255,255,.3);overflow:hidden}
#fill{height:100%;width:0;background:#fff;border-radius:7px}
#store{position:absolute;left:50%;top:1610px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#1a0b2e;color:#fff;padding:20px 38px;border-radius:70px;font-size:40px;font-weight:900;white-space:nowrap;box-shadow:0 12px 30px rgba(20,0,40,.35)}
#store .s{font-size:46px}
#store b{color:#ffd23f}
.emo{position:absolute;font-size:120px;line-height:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#mascot{position:absolute;left:50%;top:150px;width:300px;height:300px;margin-left:-150px;transform-origin:50% 100%}
#mascot svg{width:100%;height:100%;overflow:visible}
#hook{position:absolute;left:60px;right:60px;top:1495px;text-align:center;color:#fff;font-size:44px;font-weight:900;background:rgba(40,0,40,.42);padding:16px 20px;border-radius:26px;white-space:nowrap;overflow:hidden}
#outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:34px}
#outro .big{width:260px;height:260px;border-radius:66px;font-size:160px}
#outro .name{font-size:170px;font-weight:900;letter-spacing:4px}
#outro .q{font-size:62px;line-height:1.2;padding:0 80px}
#outro .store2{background:#1a0b2e;color:#ffd23f;font-size:46px;padding:24px 44px;border-radius:60px;font-weight:900}
#outro .tag{font-size:40px;opacity:.95}
#outro .cta{background:#fff;color:#ff2d8a;font-size:44px;padding:22px 46px;border-radius:60px;font-weight:900}
</style></head>
<body>
<div id="bg"></div><div id="glow"></div>
<div id="mascot"><svg viewBox="0 0 200 200">
<defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe3f0"/></linearGradient></defs>
<ellipse cx="100" cy="192" rx="62" ry="8" fill="rgba(80,0,50,.18)"/>
<g id="mbody">
<path d="M100 18 C150 18 178 50 178 104 C178 160 146 186 100 186 C54 186 22 160 22 104 C22 50 50 18 100 18 Z" fill="url(#mg)" stroke="#2a0f3d" stroke-width="7"/>
<path d="M92 20 C88 6 104 0 110 12" fill="none" stroke="#2a0f3d" stroke-width="7" stroke-linecap="round"/>
<circle cx="111" cy="10" r="7" fill="#ffd23f" stroke="#2a0f3d" stroke-width="5"/>
<ellipse cx="52" cy="122" rx="15" ry="9" fill="#ff7fb0" opacity=".75"/>
<ellipse cx="148" cy="122" rx="15" ry="9" fill="#ff7fb0" opacity=".75"/>
<g id="eyes"></g><g id="mouth"></g>
<path id="armL" d="M26 120 C8 118 4 100 12 92" fill="none" stroke="#2a0f3d" stroke-width="7" stroke-linecap="round"/>
<path id="armR" d="M174 120 C192 118 196 100 188 92" fill="none" stroke="#2a0f3d" stroke-width="7" stroke-linecap="round"/>
</g></svg></div>
<div id="top"><div class="logo">B</div><div id="count"></div></div>
<div id="text"></div>
<div id="btns"><div class="btn" id="yes"><span class="e">👍</span>J'ai déjà</div><div class="btn" id="no"><span class="e">👎</span>J'ai jamais</div></div>
<div id="bar"><div id="fill"></div></div>
<div id="outro"></div>
<div id="emos"></div><div id="flash"></div>
<div id="hook"></div>
<div id="store"><span class="s">📲</span><span>BLIZ · <b>Dispo sur l'App Store</b></span></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOutBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const easeOut=x=>1-Math.pow(1-x,3);
let TL=null, built=-1;
function setup(tl){TL=tl;if(tl.nostore){document.getElementById("store").style.visibility="hidden";window.NOSTORE=1}if(tl.btnA){document.getElementById("yes").innerHTML=`<span class="e">${tl.btnA[0]}</span>${tl.btnA[1]}`}if(tl.btnB){document.getElementById("no").innerHTML=`<span class="e">${tl.btnB[0]}</span>${tl.btnB[1]}`};const h=document.getElementById("hook");h.textContent=tl.hook||"";let f=44;while(h.scrollWidth>h.clientWidth&&f>26){f--;h.style.fontSize=f+"px"}}
function buildScene(i){
  const s=TL.scenes[i], T=document.getElementById('text');
  T.innerHTML='';
  s.words.forEach((w,k)=>{const e=document.createElement('span');e.className='w';e.textContent=w;e.dataset.k=k;T.appendChild(e)});
  if(s.box){T.appendChild(document.createElement('br'));const b=document.createElement('span');b.className='w box';b.textContent=s.box;b.dataset.k='box';T.appendChild(b)}
  const o=document.getElementById('outro');o.innerHTML='';
  if(s.type==='outro'){o.innerHTML=`<div style="height:330px"></div><div class="name">BLIZ</div><div class="q">${s.q}</div><div class="cta">${s.cta}</div>${window.NOSTORE?"":`<div class="store2">📲 Télécharge BLIZ sur l'App Store</div>`}<div class="tag">${s.tag}</div>`}
  built=i;
}

const D='#2a0f3d';
const EYES={
 open:`<ellipse cx="72" cy="92" rx="13" ry="16" fill="${D}"/><ellipse cx="128" cy="92" rx="13" ry="16" fill="${D}"/><circle cx="76" cy="86" r="5" fill="#fff"/><circle cx="132" cy="86" r="5" fill="#fff"/>`,
 blink:`<path d="M60 94 Q72 98 84 94" stroke="${D}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M116 94 Q128 98 140 94" stroke="${D}" stroke-width="7" fill="none" stroke-linecap="round"/>`,
 shock:`<circle cx="72" cy="90" r="20" fill="#fff" stroke="${D}" stroke-width="6"/><circle cx="128" cy="90" r="20" fill="#fff" stroke="${D}" stroke-width="6"/><circle cx="72" cy="92" r="8" fill="${D}"/><circle cx="128" cy="92" r="8" fill="${D}"/>`,
 laugh:`<path d="M58 96 Q72 78 86 96" stroke="${D}" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M114 96 Q128 78 142 96" stroke="${D}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
 sus:`<path d="M58 88 L86 94" stroke="${D}" stroke-width="7" stroke-linecap="round"/><path d="M142 88 L114 94" stroke="${D}" stroke-width="7" stroke-linecap="round"/><ellipse cx="74" cy="100" rx="9" ry="7" fill="${D}"/><ellipse cx="126" cy="100" rx="9" ry="7" fill="${D}"/>`,
 wink:`<ellipse cx="72" cy="92" rx="13" ry="16" fill="${D}"/><circle cx="76" cy="86" r="5" fill="#fff"/><path d="M116 94 Q128 84 140 94" stroke="${D}" stroke-width="8" fill="none" stroke-linecap="round"/>`};
const MOUTH={
 smile:`<path d="M80 128 Q100 146 120 128" stroke="${D}" stroke-width="7" fill="none" stroke-linecap="round"/>`,
 o:`<ellipse cx="100" cy="138" rx="15" ry="19" fill="${D}"/><ellipse cx="100" cy="146" rx="9" ry="7" fill="#ff5c93"/>`,
 big:`<path d="M72 124 Q100 172 128 124 Z" fill="${D}" stroke="${D}" stroke-width="5" stroke-linejoin="round"/><path d="M86 146 Q100 160 114 146 Q100 140 86 146Z" fill="#ff5c93"/>`,
 flat:`<path d="M84 136 L116 132" stroke="${D}" stroke-width="7" stroke-linecap="round"/>`,
 talk:`<ellipse cx="100" cy="134" rx="16" ry="9" fill="${D}"/>`};
let lastFace='';
function face(e,m){const k=e+m;if(k===lastFace)return;lastFace=k;document.getElementById('eyes').innerHTML=EYES[e];document.getElementById('mouth').innerHTML=MOUTH[m]}
function mascot(t,s,lt){
  const M=document.getElementById('mascot');
  const sinceBox=s.box?lt-s.boxAt:-9;
  let e='open',m='smile',sq=1,rot=Math.sin(t*2.2)*3,lift=Math.sin(t*4.4)*6, armA=Math.sin(t*3)*6;
  const talking=s.talkStart!=null&&lt>s.talkStart&&lt<s.talkEnd;
  if(talking){m=(Math.floor(lt*9)%2)?'talk':'smile'}
  if((t%3.1)<0.12)e='blink';
  if(s.type==='q'){
    if(sinceBox>0&&sinceBox<0.7){e='shock';m='o';const p=sinceBox/0.7;sq=1+0.18*Math.sin(p*Math.PI*3)*(1-p);armA=-35}
    else if(sinceBox>=0.7){e=s.mood||'laugh';m=s.mood==='sus'?'flat':'big';rot+=s.mood==='sus'?-6:Math.sin(lt*18)*5;armA=s.mood==='sus'?10:-25+Math.sin(lt*16)*12}
  }
  if(s.type==='intro'){m=talking?m:'big';armA=-40+Math.sin(t*10)*15}
  if(s.type==='outro'){e='wink';m='big';armA=-45+Math.sin(t*9)*20}
  face(e,m);
  M.style.top=(s.type==='outro'?260:185)+'px';
  M.style.transform=`translateY(${-lift}px) rotate(${rot}deg) scale(${2-sq},${sq})`;
  document.getElementById('armL').setAttribute('transform',`rotate(${armA} 26 120)`);
  document.getElementById('armR').setAttribute('transform',`rotate(${-armA} 174 120)`);
  M.style.display='block';
}
function render(t){
  const bg=document.getElementById('bg');
  bg.style.transform=`translate(${Math.sin(t*0.35)*60}px,${Math.cos(t*0.27)*60}px) rotate(${Math.sin(t*0.2)*4}deg)`;
  document.getElementById('glow').style.transform=`translate(${Math.sin(t*0.5)*120}px,${Math.cos(t*0.4)*90}px)`;
  let i=TL.scenes.findIndex(s=>t>=s.start&&t<s.end); if(i<0)i=TL.scenes.length-1;
  if(i!==built)buildScene(i);
  const s=TL.scenes[i], lt=t-s.start, D=s.end-s.start;
  const out=clamp((D-lt)/0.18);           // fade at scene end
  const cnt=document.getElementById('count');
  cnt.style.display=s.n?'block':'none'; if(s.n)cnt.textContent=`${s.n} / ${TL.total}`;
  document.getElementById('top').style.opacity=s.type==='outro'?0:1;
  document.querySelectorAll('#text .w').forEach(e=>{
    const at=e.dataset.k==='box'?s.boxAt:s.wordAt[+e.dataset.k];
    const p=clamp((lt-at)/0.22);
    const sc=e.dataset.k==='box'?0.4+0.6*easeOutBack(p):0.6+0.4*easeOutBack(p);
    e.style.opacity=p>0?Math.min(1,p*3)*out:0;
    e.style.transform=`translateY(${(1-easeOut(p))*30}px) scale(${sc})`;
  });
  const btns=document.getElementById('btns'), bar=document.getElementById('bar');
  if(s.btnAt!=null){
    const p=clamp((lt-s.btnAt)/0.3);
    btns.style.opacity=(p>0?1:0)*out;
    btns.style.transform=`translateY(${(1-easeOut(p))*120}px) scale(${0.8+0.2*easeOutBack(p)})`;
    const pulse=s.barAt!=null&&lt>s.barAt?1+0.04*Math.sin((lt-s.barAt)*9):1;
    document.getElementById('yes').style.transform=`scale(${pulse})`;
    document.getElementById('no').style.transform=`scale(${2-pulse})`;
  } else btns.style.opacity=0;
  if(s.barAt!=null){
    bar.style.opacity=(lt>s.barAt?1:0)*out;
    document.getElementById('fill').style.width=(clamp((lt-s.barAt)/(D-0.2-s.barAt))*100)+'%';
  } else bar.style.opacity=0;
  // punch effects: shake + flash + emoji burst
  const sinceBox=s.box?lt-s.boxAt:-1;
  const shake=(sinceBox>0&&sinceBox<0.25)?Math.sin(sinceBox*90)*14*(1-sinceBox/0.25):0;
  document.getElementById('text').style.transform=`translateX(${shake}px) rotate(${shake*0.08}deg)`;
  document.getElementById('flash').style.opacity=(sinceBox>0&&sinceBox<0.12)?0.35*(1-sinceBox/0.12):0;
  const E=document.getElementById('emos');
  if(E.dataset.scene!=String(i)){E.dataset.scene=i;E.innerHTML='';(s.emos||[]).forEach((c,k)=>{const d=document.createElement('div');d.className='emo';d.textContent=c;E.appendChild(d)})}
  [...E.children].forEach((d,k)=>{
    const p=clamp((sinceBox-0.05-k*0.08)/0.9);
    const x=[150,800,700][k%3], y0=[420,400,330][k%3];
    d.style.left=x+'px'; d.style.top=(y0-easeOut(p)*230)+'px';
    d.style.opacity=(p>0&&p<1)?Math.min(1,(1-p)*3):0;
    d.style.transform=`scale(${0.5+easeOutBack(Math.min(1,p*3))*0.7}) rotate(${(k%2?1:-1)*p*25}deg)`;
  });
  mascot(t,s,lt);
  document.getElementById('hook').style.display=s.type==='outro'?'none':'block';
  const st=document.getElementById('store');
  st.style.transform=`translateX(-50%) scale(${1+0.035*Math.sin(t*4)})`;
  st.style.display=(s.type==='outro'||window.NOSTORE)?'none':'flex';
  if(s.type==='outro'){
    [...document.getElementById('outro').children].forEach((e,k)=>{
      const p=clamp((lt-0.12*k)/0.35);
      e.style.opacity=p;e.style.transform=`translateY(${(1-easeOut(p))*60}px) scale(${0.7+0.3*easeOutBack(p)})`;
    });
  }
}
</script></body></html>
