<script>
// mode clair (Dégradé vif) ou sombre (Aurore) : choisi dans Réglages, sinon celui du téléphone ; posé avant le premier affichage
function applyTheme() {
  let t = "auto"; try { t = JSON.parse(localStorage.getItem("scandale:theme")) || "auto"; } catch (e) {}
  if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  let m = document.querySelector('meta[name="theme-color"]');
  if (!m) { m = document.createElement("meta"); m.name = "theme-color"; document.head.appendChild(m); }
  m.content = t === "dark" ? "#061224" : "#FFF4F0";
}
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
</script>
<style>
/* =====================================================================
   PLATOZ · skin "NÉON" — night-club party energy
   ---------------------------------------------------------------------
   Palette    night #0B0720 / #140D33, lavender text #F6F3FF / #C9C0F2
              neon tokens: pink #FF3B6E, gold #FFE04A, violet #A66BFF,
              blue #4D8BFF, mint #2EE6A0
              one gradient per game type (deep at the bottom so white text
              stays AA): ultraviolet, sunset pink, gold, aqua-mint,
              electric blue, hot magenta. Signature gradient pink→violet→indigo.
   Type       Unbounded 700-900 (chunky rounded geometric display) +
              Nunito 600-900 (rounded, very legible body, big bold buttons).
   Shape      4 radii only: --r-xl 32 (cards, sheet, une, hero, secret),
              --r-l 24 (tiles, options, panels, inputs), --r-s 16 (badges,
              stats), 999px pills. No hard lines, glass hairlines.
   Motion     cards bounce in (420ms, overshoot), buttons squish on press,
              stamps flash like a neon sign turning on, false start shakes.
              Reduced motion respected.
   Signature  glowing gradient cards that behave like light sources, each
              carrying its game symbol as a NEON TUBE outline (? ! § # VS ?!),
              the same tubes on the home tiles, and a night background that
              re-tints to the colour of the card on screen.
   ===================================================================== */
:root {
  --paper: #EEE9FF;
  --paper-2: #241B52;
  --ink: #1A0F2E;
  --ink-soft: #C9C0F2;
  --red: #FF3B6E;
  --yellow: #FFE04A;
  --violet: #A66BFF;
  --blue: #4D8BFF;
  --green: #2EE6A0;
  --radar: #6366F1;
  --rank: #FF8A1F;
  --taboo: #E0245E;
  --yesno: #14B8A6;
  --white: #FFFFFF;
  --display: "Unbounded", "Arial Rounded MT Bold", "Arial Black", sans-serif;
  --body: "Nunito", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;

  --night: #0B0720;
  --night-2: #140D33;
  --glass: rgba(255,255,255,.07);
  --glass-2: rgba(255,255,255,.12);
  --hair: rgba(255,255,255,.14);
  --text: #F6F3FF;
  --muted: #C9C0F2;

  --r-xl: 32px;
  --r-l: 24px;
  --r-s: 16px;

  --g-uv: linear-gradient(165deg, #A552FF 0%, #6A2CF0 52%, #4419C9 100%);
  --g-sunset: linear-gradient(165deg, #FF7A45 0%, #FF3577 38%, #E0186A 72%, #C0105C 100%);
  --g-gold: linear-gradient(165deg, #FFEC6E 0%, #FFC83A 45%, #FF942E 100%);
  --g-mint: linear-gradient(165deg, #A6FF8F 0%, #3CF0B0 42%, #14C6D0 100%);
  --g-blue: linear-gradient(165deg, #42B4FF 0%, #2D6BFF 45%, #3A36D8 100%);
  --g-magenta: linear-gradient(165deg, #F43FD2 0%, #C21FB0 50%, #8A1AB8 100%);
  --g-hot: linear-gradient(100deg, #FF2E7A 0%, #F2402F 100%);
  --g-signature: linear-gradient(140deg, #E8226E 0%, #A532E6 55%, #5B3BFF 100%);
  --g-cool: linear-gradient(100deg, #3D7BFF 0%, #7B3BFF 100%);

  --flame: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 24'><path d='M10.6 1c.9 4.6 6.9 7.3 6.9 14a7.5 7.5 0 0 1-15 0c0-3.4 1.8-5.8 3.6-7.5.1 2.4 1 3.9 2.5 4.4-.6-3.9.2-7.7 2-10.9z'/></svg>");

  --amb1: rgba(140,60,255,.38);
  --amb2: rgba(255,45,130,.26);
  --amb3: rgba(40,120,255,.22);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--night); overflow: hidden; overscroll-behavior: none; }
/* Safari : la page ne défile plus, donc sa barre du bas ne se replie plus ; on s'arrête au-dessus d'elle (zone visible réelle) */
@supports (height: 100dvh) { html { height: 100dvh; } }
/* appli de l'écran d'accueil : hauteur réelle de la zone de la page (iOS 26 la donne plus courte qu'elle n'est) */
html.standalone { height: var(--app-h, 100dvh); }
body {
  margin: 0;
  background: var(--night);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; /* la page ne rebondit plus : seul un contenu trop long défile */
  -webkit-font-smoothing: antialiased;
}
/* night-club ambient light: three soft blobs + irregular sparkle, tinted by the card on screen */
body::after {
  content: ""; position: fixed; inset: 0 0 -160px; pointer-events: none; z-index: 0; /* déborde en bas : le fond va jusqu'au bord de l'écran même quand iOS se trompe de hauteur */
  background:
    radial-gradient(70% 42% at 8% 4%, var(--amb1), transparent 70%),
    radial-gradient(60% 40% at 100% 96%, var(--amb2), transparent 70%),
    radial-gradient(48% 30% at 96% 30%, var(--amb3), transparent 72%),
    radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px) 0 0 / 37px 41px,
    radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.5px) 13px 19px / 53px 47px;
}
body:has(.card[style*="--violet"]) { --amb1: rgba(150,70,255,.42); --amb2: rgba(80,50,240,.30); --amb3: rgba(200,90,255,.20); }
body:has(.card[style*="--red"]) { --amb1: rgba(255,60,120,.36); --amb2: rgba(255,110,60,.24); --amb3: rgba(230,30,110,.20); }
body:has(.card[style*="--yellow"]) { --amb1: rgba(255,120,60,.30); --amb2: rgba(255,60,140,.22); --amb3: rgba(255,210,80,.10); }
body:has(.card[style*="--green"]) { --amb1: rgba(60,240,170,.24); --amb2: rgba(20,190,210,.26); --amb3: rgba(150,255,140,.12); }
body:has(.card[style*="--blue"]) { --amb1: rgba(60,150,255,.34); --amb2: rgba(60,60,230,.30); --amb3: rgba(66,180,255,.18); }
body:has(.card[style*="--ink"]) { --amb1: rgba(255,80,210,.32); --amb2: rgba(142,45,226,.32); --amb3: rgba(255,120,220,.16); }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
::selection { background: var(--red); color: #fff; }
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(22px + env(safe-area-inset-bottom, 0px)); /* la page va jusqu'en bas de l'écran, les boutons restent au-dessus de la barre de l'iPhone */
  gap: 16px;
  position: relative;
}
#app > * { position: relative; z-index: 1; }

/* ---------- type ---------- */
.mast { font-family: var(--display); font-weight: 800; line-height: 1.05; letter-spacing: -.01em; overflow-wrap: break-word; }
.eyebrow { font-weight: 900; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

/* ---------- masthead ---------- */
.masthead { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 14px; text-align: center; }
.masthead .logo {
  font-family: var(--display); font-weight: 900; font-size: clamp(58px, 18vw, 84px); line-height: 1; letter-spacing: -.035em;
  background: linear-gradient(100deg, #FFB547 0%, #FF3B7A 40%, #B04BFF 75%, #5E8BFF 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 22px rgba(255,59,122,.45));
  padding: 4px 6px 6px;
}
.masthead .rule { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .02em; }
.masthead .rule span { background: none; border: 0; padding: 0; }
.masthead .rule span + span::before { content: "·"; margin-right: 8px; color: #FF6FA0; font-weight: 900; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.topbar .title { font-family: var(--display); font-weight: 800; font-size: 21px; text-align: center; flex: 1; min-width: 0; }
.iconbtn {
  width: 48px; height: 48px; border-radius: 999px; border: 1px solid var(--hair); background: var(--glass-2); color: var(--text);
  display: grid; place-items: center; font-weight: 900; font-size: 18px; flex: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18); transition: transform .12s;
}
.iconbtn:active { transform: scale(.9); }

/* ---------- buttons ---------- */
.btn {
  --bg: var(--g-gold); --fg: var(--ink); --gl: rgba(255,190,50,.45);
  border: 0; border-radius: 999px; background: var(--bg); color: var(--fg);
  min-height: 62px; padding: 15px 22px; width: 100%;
  font-family: var(--body); font-weight: 900; font-size: 19px; line-height: 1.15; letter-spacing: .005em;
  box-shadow: 0 12px 30px -10px var(--gl), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.14);
  transition: transform .12s cubic-bezier(.3,1.6,.5,1), filter .12s;
  text-wrap: balance;
}
.btn:active { transform: scale(.96); filter: brightness(1.06); }
.btn.red { --bg: var(--g-hot); --fg: #fff; --gl: rgba(255,50,110,.55); text-shadow: 0 1px 2px rgba(120,0,40,.35); }
.btn.ink, .btn.white { --bg: rgba(255,255,255,.1); --fg: #fff; --gl: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.34), inset 0 2px 0 rgba(255,255,255,.1); }
.btn.green { --bg: var(--g-mint); --fg: var(--ink); --gl: rgba(40,230,170,.45); }
.btn.blue { --bg: linear-gradient(100deg, #3D7BFF 0%, #4A3BF0 100%); --fg: #fff; --gl: rgba(70,110,255,.55); }
/* binary choices get equal weight: the left option becomes a cool gradient twin */
.actions .row > .btn.white:first-child:has(+ .btn:not(.green)) {
  --bg: var(--g-cool); --fg: #fff; --gl: rgba(90,90,255,.55);
  box-shadow: 0 12px 30px -10px var(--gl), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.14);
  text-shadow: 0 1px 2px rgba(20,0,80,.3);
}
.btn:disabled, .btn.red:disabled {
  opacity: 1; filter: none; pointer-events: none;
  --bg: rgba(255,255,255,.07); --fg: rgba(255,255,255,.5);
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); text-shadow: none;
}
.btn small { display: block; font-weight: 700; font-size: 14px; letter-spacing: 0; margin-top: 3px; opacity: .9; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }
.actions { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
.linkbtn { background: none; border: 0; font-weight: 800; font-size: 16px; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; padding: 12px; }

/* ---------- home ---------- */
.hero-mode {
  position: relative; overflow: hidden; text-align: left; border: 0; border-radius: var(--r-xl); color: #fff;
  background: var(--g-signature); padding: 22px 22px 24px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 22px 60px -18px rgba(220,50,200,.7), inset 0 2px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.14);
  transition: transform .14s cubic-bezier(.3,1.6,.5,1);
}
.hero-mode::before { content: ""; position: absolute; width: 260px; height: 260px; right: -80px; top: -110px; border-radius: 50%; border: 30px solid rgba(255,255,255,.12); pointer-events: none; }
.hero-mode::after {
  content: "▶"; position: absolute; right: 18px; top: 18px; width: 52px; height: 52px; border-radius: 50%;
  background: #fff; color: #D2268F; display: grid; place-items: center; font-size: 18px; padding-left: 3px;
  box-shadow: 0 6px 18px rgba(80,0,60,.35);
}
.hero-mode:active { transform: scale(.98); }
.hero-mode > * { position: relative; }
.hero-mode .mast { font-size: clamp(28px, 8.4vw, 34px); color: #fff; padding-right: 60px; line-height: 1.04; }
.hero-mode p { font-size: 17px; line-height: 1.4; font-weight: 700; color: #fff; }
.hero-mode .tagline {
  align-self: flex-start; background: rgba(25,5,60,.32); color: #fff; font-weight: 900; font-size: 12px; letter-spacing: .14em;
  padding: 6px 11px; border-radius: 999px; text-transform: uppercase;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  --tg: var(--g-uv); --tf: #fff; --tgl: rgba(140,70,255,.45); --tglyph: "!"; --tglow: rgba(255,255,255,.55);
  position: relative; overflow: hidden; text-align: left; border: 0; border-radius: var(--r-l); background: var(--tg); color: var(--tf);
  padding: 16px 14px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 158px;
  box-shadow: 0 14px 30px -16px var(--tgl), inset 0 2px 0 rgba(255,255,255,.32), inset 0 0 0 1px rgba(255,255,255,.12);
  transition: transform .14s cubic-bezier(.3,1.6,.5,1);
}
/* each game's symbol as a neon tube */
.tile::after {
  content: var(--tglyph); position: absolute; right: 2px; bottom: -16px; pointer-events: none;
  font-family: var(--display); font-weight: 900; font-size: 70px; line-height: 1; letter-spacing: -.06em;
  color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.62);
  filter: drop-shadow(0 0 5px var(--tglow)) drop-shadow(0 0 14px var(--tglow));
  transform: rotate(10deg);
}
.tile:active { transform: scale(.95); }
.tile[data-mode="jamais"] { --tglyph: "!"; --tg: linear-gradient(165deg, #8E3FFF 0%, #6A2CF0 50%, #4419C9 100%); --tgl: rgba(140,70,255,.55); }
.tile[data-mode="av"] { --tglyph: "?!"; --tg: var(--g-gold); --tf: var(--ink); --tgl: rgba(255,180,40,.45); --tglow: rgba(255,110,0,.7); }
.tile[data-mode="qui"] { --tglyph: "?"; --tg: linear-gradient(165deg, #F2205A 0%, #D0105E 55%, #A80C50 100%); --tgl: rgba(255,50,110,.55); }
.tile[data-mode="pref"] { --tglyph: "VS"; --tg: linear-gradient(165deg, #E62CC6 0%, #C21FB0 50%, #9A1494 100%); --tgl: rgba(240,60,210,.5); }
.tile[data-mode="imposteur"] { --tglyph: "#"; --tg: var(--g-mint); --tf: var(--ink); --tgl: rgba(40,230,170,.4); --tglow: rgba(0,140,160,.75); }
.tile[data-mode="radar"] { --tglyph: "%"; --tg: linear-gradient(165deg, #22D3EE 0%, #6366F1 55%, #7C3AED 100%); --tgl: rgba(80,120,255,.5); grid-column: 1 / -1; }
.tile[data-mode="classement"] { --tglyph: "1."; --tg: linear-gradient(165deg, #FFB03A 0%, #FF7A1A 55%, #E2480E 100%); --tgl: rgba(255,130,30,.5); }
.tile[data-mode="ouinon"] { --tglyph: "O"; --tg: linear-gradient(165deg, #2DD4BF 0%, #14A89A 55%, #0E7C86 100%); --tgl: rgba(30,200,180,.45); }
.tile[data-mode="menteur"] { --tglyph: "≠"; --tg: linear-gradient(165deg, #2D6BFF 0%, #3550F0 50%, #3A36D8 100%); --tgl: rgba(60,110,255,.55); }
.tile[data-mode="jamais"]::after { right: 18px; }
.tile[data-mode="pref"]::after { font-size: 48px; bottom: -6px; right: 0; }
.tile[data-mode="av"]::after, .tile[data-mode="imposteur"]::after { -webkit-text-stroke-color: rgba(255,255,255,.95); }
.tile .sw { display: none; }
.tile .mast { font-size: 16px; line-height: 1.12; position: relative; z-index: 1; }
.tile p { font-size: 14.5px; line-height: 1.32; font-weight: 700; color: inherit; position: relative; z-index: 1; max-width: 96%; }
.tile:not([data-mode="av"]):not([data-mode="imposteur"]) p, .tile:not([data-mode="av"]):not([data-mode="imposteur"]) .mast { text-shadow: 0 1px 2px rgba(60,0,40,.35); }

/* ---------- players ---------- */
.field { display: flex; gap: 10px; }
.field input, .duo-in {
  flex: 1; min-width: 0; border: 1.5px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: #fff;
  border-radius: var(--r-l); padding: 16px 18px; font: inherit; font-size: 19px; font-weight: 800;
  box-shadow: inset 0 2px 8px rgba(0,0,0,.25);
}
.field input::placeholder, .duo-in::placeholder { color: rgba(220,212,255,.66); font-weight: 700; }
.duo-in:disabled { opacity: .45; }
.field input:focus, .duo-in:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(255,59,110,.22); outline: none; }
.field .btn { width: auto; padding: 0 22px; min-height: 58px; font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--hair); background: var(--glass-2); color: #fff;
  padding: 7px 7px 7px 16px; border-radius: 999px; font-weight: 900; font-size: 17px; min-height: 46px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
  animation: chipIn .3s cubic-bezier(.3,1.5,.5,1) both;
}
.chip .x { border: 0; background: rgba(255,255,255,.2); color: #fff; width: 32px; height: 32px; border-radius: 50%; font-weight: 900; font-size: 18px; display: grid; place-items: center; line-height: 1; }
/* each player gets a colour */
#chips .chip { border: 0; font-size: 19px; min-height: 52px; padding: 8px 8px 8px 18px; box-shadow: 0 10px 24px -12px var(--cg, rgba(0,0,0,.5)), inset 0 2px 0 rgba(255,255,255,.3); text-shadow: 0 1px 2px rgba(40,0,40,.3); }
#chips .chip:nth-child(5n+1) { background: var(--g-sunset); --cg: rgba(255,50,110,.7); }
#chips .chip:nth-child(5n+2) { background: var(--g-uv); --cg: rgba(130,60,255,.7); }
#chips .chip:nth-child(5n+3) { background: var(--g-blue); --cg: rgba(50,110,255,.7); }
#chips .chip:nth-child(5n+4) { background: var(--g-magenta); --cg: rgba(220,60,215,.7); }
#chips .chip:nth-child(5n+5) { background: var(--g-gold); color: var(--ink); text-shadow: none; --cg: rgba(255,170,40,.6); }
#chips .chip:nth-child(5n+5) .x { background: rgba(26,15,46,.14); color: var(--ink); }
#chips > .hint { padding: 4px 2px; }
.chip.pick { cursor: pointer; padding: 10px 18px; min-height: 50px; font-size: 18px; }
.chip.pick[aria-pressed="true"] { background: #fff; color: #C2105C; border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.28), 0 8px 18px -6px rgba(0,0,0,.4); }
@keyframes chipIn { from { transform: scale(.6); opacity: 0; } }
.hint { font-size: 15px; line-height: 1.45; font-weight: 700; }
/* groupes : bulles qui flottent */
#bubbles { flex: 1; min-height: 190px; position: relative; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 16px 14px; padding: 6px 0; }
#bubbles .linkbtn { flex-basis: 100%; padding: 4px; font-size: 15px; }
.bubble {
  --amp: 8px; --dur: 4.6s; --dl: 0s;
  border: 1.5px solid rgba(255,255,255,.5); color: #fff; font: inherit; font-weight: 900; font-size: 16px; max-width: 100%;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 92px; min-height: 92px; padding: 12px 16px; border-radius: 999px;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), rgba(255,255,255,.08) 38%, rgba(166,107,255,.38) 100%);
  box-shadow: 0 12px 30px -10px rgba(166,107,255,.8), inset 0 -6px 14px rgba(255,59,122,.25), inset 0 2px 0 rgba(255,255,255,.4);
  text-shadow: 0 1px 3px rgba(40,0,60,.55); animation: bFloat calc(var(--dur) * 2.2) ease-in-out var(--dl) infinite alternate;
}
.bubble small { font-size: 12px; font-weight: 800; opacity: .85; }
.bubble span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
.bubble { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: box-shadow .18s; }
.bubble, .bubble * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.bubble.held { animation-play-state: paused; z-index: 50; box-shadow: 0 22px 44px -12px rgba(166,107,255,.95), inset 0 -6px 14px rgba(255,59,122,.25), inset 0 2px 0 rgba(255,255,255,.4); }
/* fin de Je n'ai jamais : même nuit que l'appli, avec la lueur violette de la partie, plus forte */
body:has(.fin-jamais) { --amb1: rgba(150,70,255,.62); --amb2: rgba(255,60,150,.42); --amb3: rgba(120,90,255,.40); }
.fin-jamais .end-bubbles { background: radial-gradient(closest-side, rgba(140,70,255,.5), rgba(140,70,255,.18) 60%, transparent); margin: 0 -16px; }
.fin-jamais .mast { text-shadow: 0 0 26px rgba(170,110,255,.85); }
.fin-jamais .rank-date { color: rgba(255,255,255,.8); }
.mbest { margin: 6px auto 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 22px; border-radius: 22px; border: 2px solid #FF3B6E; background: rgba(255,59,110,.12); box-shadow: 0 0 40px -10px rgba(255,59,110,.6); color: #fff; text-align: center; font-weight: 800; animation: impPop .7s .3s cubic-bezier(.2,1.5,.4,1) both; }
.mbest span { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.mbest b { font-family: var(--display); font-size: min(9vw, 36px); line-height: 1.1; color: #FF6A90; text-shadow: 0 0 24px rgba(255,59,110,.6); }
.mbest small { font-size: 13px; opacity: .7; }
/* Test de pureté */
.pur-themes { justify-content: center; }
.pur-themes .chip.pick { padding: 10px 16px; min-height: 48px; font-size: 17px; }
.card .pur-th { margin: 0 22px; font-weight: 800; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.jstack > .card.gone { position: absolute; inset: 0; margin: 0; z-index: 2; pointer-events: none; }
.card .tlean { position: absolute; top: 76px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 5; }
.card .tlean b { font-family: var(--display); font-size: 30px; padding: 2px 14px; border: 4px solid currentColor; border-radius: 14px; text-transform: uppercase; opacity: 0; transition: opacity .12s; background: rgba(0,0,0,.18); }
.card .tlean .ty { color: #6DFFB0; transform: rotate(-12deg); }
.card .tlean .tn { color: #fff; transform: rotate(12deg); order: 2; }
.card[data-lean="y"] .tlean .ty, .card[data-lean="n"] .tlean .tn { opacity: 1; }
.pur-def { margin: 0; text-align: center; color: #fff; font-size: 16px; }
.pur-def b { display: block; font-family: var(--display); font-size: min(6.4vw, 24px); margin-top: 2px; }
.pur-bars { display: grid; grid-template-columns: max-content 1fr auto; align-items: center; gap: 7px 10px; width: 100%; max-width: 420px; margin: 0 auto; }
.pur-row { display: contents; color: #fff; font-weight: 800; font-size: 15px; }
.pur-row > * { color: #fff; font-weight: 800; font-size: 15px; }
.pur-row span { white-space: nowrap; }
.pur-row i { height: 12px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; }
.pur-row u { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FF3B6E, #FFB23A); box-shadow: 0 0 12px rgba(255,90,120,.6); }
.pur-row b { text-align: right; font-variant-numeric: tabular-nums; }
.pur-how span { white-space: nowrap; }
.pur-how { margin: 0; text-align: center; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.7); }
.sheet .pur-bars, .sheet .pur-def { color: inherit; }
@media (max-height: 700px) { .sheet .mbest { padding: 6px 18px; margin-top: 0; } .sheet .mbest b { font-size: 28px; } .sheet .pur-bars { gap: 4px 10px; } .sheet .pur-def b { font-size: 20px; } .pur-fin .pur-bars { gap: 5px 10px; } }
@media (max-height: 600px) { .sheet .pur-def b { display: inline; font-size: 17px; } .sheet > .mast { font-size: 24px !important; } .sheet .mbest { gap: 0; } .sheet .mbest b { font-size: 24px; } .sheet .pur-row > * { font-size: 14px; } }
.fin-jamais .bubble { font-size: 18px; min-width: 100px; min-height: 100px;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.75), rgba(190,140,255,.45) 36%, rgba(140,70,255,.9) 100%);
  box-shadow: 0 14px 34px -8px rgba(166,107,255,.95), 0 0 30px -4px rgba(166,107,255,.75), inset 0 -6px 14px rgba(255,59,122,.35), inset 0 2px 0 rgba(255,255,255,.5); }
.end-bubbles { flex: 1; min-height: 130px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 18px 14px; padding: 10px 0; transition: opacity .5s; }
.end-bubbles.wait { opacity: 0; pointer-events: none; }
.lobby-bubbles { flex: none; min-height: 150px; }
/* aucune page ne défile, sauf le menu : si ça ne tient pas, on resserre, puis on réduit tout l'écran */
body.lock { overflow: hidden; }
body.squeeze #app { gap: 10px; padding-top: 4px; }
body.squeeze #bubbles { min-height: 110px; }
body.squeeze .lobby-bubbles { min-height: 100px; }
body.squeeze .stage > .secret { min-height: 0; }
body.squeeze #chips { gap: 6px; max-height: 32vh; overflow-y: auto; flex: none; }
body.squeeze #app:has(#chips) .actions::before { display: none; }
body.squeeze #bubbles { gap: 8px 10px; padding: 0; }
body.squeeze #bubbles .linkbtn { padding: 2px; }
body.squeeze #chips .chip { font-size: 15px; min-height: 38px; padding: 4px 5px 4px 12px; gap: 6px; }
/* Tester les cartes : deux colonnes, tout tient sur un écran */
.opts.tester-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts.tester-opts .opt { min-height: 0; padding: 10px 12px; gap: 10px; }
.opts.tester-opts .opt .pepper { width: 34px; height: 34px; font-size: 14px; }
.opts.tester-opts .opt .mast { font-size: 15px; }
.opts.tester-opts .opt p { font-size: 12.5px; }
/* iOS 26 : bande de l'heure dessinée par le système, la page commence dessous ; le haut du fond se fond dans cette bande */
body.ios-band::after { -webkit-mask-image: linear-gradient(transparent, #000 70px); mask-image: linear-gradient(transparent, #000 70px); }
/* paquet de cartes : la carte du dessous reste cachée pendant que la carte du dessus arrive (sinon elle transparaît) */
.jstack:has(> .card.top:not(.still)) > .card.under { animation: underWait .42s step-end both; }
@keyframes underWait { from { visibility: hidden; } to { visibility: visible; } }
.fr-row .fr-join { flex: none; width: auto; min-height: 40px; padding: 0 16px; font-size: 15px; margin-left: auto; }
.fr-row .fr-txt { flex: 1; }
/* les bulles passent au-dessus du reste de l'écran : une bulle lâchée sur les boutons reste attrapable */
#app > *:has(.bubble) { z-index: 3; }
.bubble.free { animation: none !important; }
.bubble.free.pop { animation: bPop .26s ease-out forwards !important; }
.end-bubbles, #bubbles { pointer-events: none; }
.end-bubbles .bubble, #bubbles .bubble, #bubbles .linkbtn { pointer-events: auto; }
.end-bubbles.wait .bubble { pointer-events: none; }
.bubble.pop { animation: bPop .26s ease-out forwards; pointer-events: none; }
.bubble.back { animation: chipIn .5s cubic-bezier(.3,1.5,.5,1) both, bFloat calc(var(--dur) * 2.2) ease-in-out var(--dl) infinite alternate; }
.spark { position: fixed; z-index: 90; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; left: 0; top: 0; }
.grp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 14px; background: rgba(0,0,0,.2); font-weight: 800; }
.grp-row button { border: 0; background: rgba(255,255,255,.2); color: #fff; width: 32px; height: 32px; border-radius: 50%; font-weight: 900; font-size: 18px; flex: none; }
.sheet .grp-in { width: 100%; box-sizing: border-box; }
.gm-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(0,0,0,.22); }
.gm-row > span:first-child { min-width: 0; display: grid; gap: 2px; }
.gm-row small { color: var(--muted); font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-row.ask { box-shadow: inset 0 0 0 1.5px var(--red); }
.gm-ask { display: flex; gap: 8px; flex: none; }
.gm-btn { flex: none; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: #fff; font-weight: 900; font-size: 14px; padding: 8px 12px; border-radius: 999px; }
.gm-btn.red { background: var(--red); border-color: var(--red); }
@keyframes bFloat {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  25% { transform: translate(calc(var(--amp) * 2.4), calc(var(--amp) * -1.6)) rotate(4deg) scale(1.04); }
  50% { transform: translate(calc(var(--amp) * .8), calc(var(--amp) * 1.8)) rotate(-3deg) scale(.97); }
  75% { transform: translate(calc(var(--amp) * -2.4), calc(var(--amp) * .4)) rotate(3deg) scale(1.03); }
  100% { transform: translate(calc(var(--amp) * -1), calc(var(--amp) * -1.8)) rotate(-2deg) scale(1); }
}
@keyframes bPop { to { transform: scale(1.7); opacity: 0; } }
/* players screen: fill the room with the neon sign */
#app:has(#chips) .actions::before {
  content: "La team"; display: block; text-align: center; margin: 0 auto 18px; pointer-events: none;
  font-family: var(--display); font-weight: 900; font-size: clamp(44px, 14vw, 62px); line-height: 1; letter-spacing: -.03em;
  color: transparent; -webkit-text-stroke: 2px rgba(255,140,190,.75);
  filter: drop-shadow(0 0 6px rgba(255,59,122,.8)) drop-shadow(0 0 22px rgba(255,59,122,.45));
  transform: rotate(-6deg); opacity: .9;
}

/* ---------- options ---------- */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  --c: var(--violet);
  text-align: left; border: 1px solid var(--hair); background: var(--glass); color: var(--text); border-radius: var(--r-l);
  padding: 14px 16px; display: flex; gap: 14px; align-items: center; min-height: 78px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  transition: transform .14s cubic-bezier(.3,1.6,.5,1), background .2s;
}
.opt:active { transform: scale(.98); }
.opt[aria-pressed="true"] {
  background: var(--g-signature); border-color: transparent; color: #fff;
  box-shadow: 0 14px 34px -14px rgba(220,50,200,.75), inset 0 2px 0 rgba(255,255,255,.3);
}
.opt[aria-pressed="true"] p { color: #fff; }
.opt .mast { font-size: 17px; display: block; line-height: 1.15; }
.opt p { font-size: 14.5px; line-height: 1.35; color: var(--muted); margin-top: 3px; font-weight: 700; }
.opt .pepper {
  position: relative; font-family: var(--display); font-weight: 800; font-size: 16px; width: 54px; height: 54px; flex: none; border-radius: var(--r-s);
  display: grid; place-items: center; color: var(--red); background: rgba(255,255,255,.08);
  letter-spacing: -.04em;
}
/* intensity: real flames, coloured by heat */
.opt[data-l] .pepper { color: transparent; font-size: 0; }
.opt[data-l] .pepper::before {
  content: ""; height: 22px; width: calc(var(--n) * 17px); background: var(--c);
  -webkit-mask: var(--flame) left center / 17px 21px repeat-x; mask: var(--flame) left center / 17px 21px repeat-x;
  filter: drop-shadow(0 0 6px var(--c));
}
.opt[data-l="1"] { --n: 1; --c: var(--green); }
.opt[data-l="2"] { --n: 2; --c: #FFB23A; }
.opt[data-l="3"] { --n: 3; --c: var(--red); }
.opt[data-l="3"] .pepper::before { width: 46px; -webkit-mask-size: 15.3px 19px; mask-size: 15.3px 19px; }
.opt[aria-pressed="true"] .pepper { background: #fff; }
.opt[aria-pressed="true"][data-l="1"] .pepper::before { background: #0A9E6A; filter: none; }
.opt[aria-pressed="true"][data-l="2"] .pepper::before { background: #E46A00; filter: none; }
.opt[aria-pressed="true"][data-l="3"] .pepper::before { background: #E0185E; filter: none; }
/* solo & duo games: tinted strips with real icons instead of cryptic numbers */
.opts .opt[data-solo] {
  background: linear-gradient(100deg, rgba(255,255,255,.11), rgba(255,255,255,.04));
  border-color: rgba(255,255,255,.18);
  box-shadow: inset 4px 0 0 var(--c), inset 0 1px 0 rgba(255,255,255,.1), -6px 0 22px -14px var(--c);
}
.opt[data-solo="deux"] { --c: #FF4FD8; --ico: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='8' cy='7.5' r='3.6'/><circle cx='16.8' cy='8.6' r='3'/><path d='M1.2 20.5c0-4.3 3-7 6.8-7s6.8 2.7 6.8 7z'/><path d='M14.2 13.9c.8-.4 1.7-.6 2.6-.6 3.2 0 5.9 2.4 5.9 6.3h-6.4c0-2.4-.7-4.3-2.1-5.7z'/></svg>"); }
.opt[data-solo="reflexe"] { --c: #4DB5FF; --ico: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M14 1 3.8 13.6h6.8L9 23 20.2 9.6h-6.9z'/></svg>"); }
.opt[data-solo="test"] { --c: #FFB23A; --ico: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='6.5' cy='6.5' r='3.6'/><circle cx='17.5' cy='17.5' r='3.6'/><path d='M18.4 3.4l2.2 2.2L5.6 20.6l-2.2-2.2z'/></svg>"); }
.opt[data-solo] .pepper { color: transparent !important; font-size: 0; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.opt[data-solo] .pepper::before {
  content: ""; width: 28px; height: 28px; background: var(--c);
  -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat;
  filter: drop-shadow(0 0 6px var(--c));
}
.seg { display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid var(--hair); }
.seg button { flex: 1; min-width: 0; border: 0; background: none; color: var(--muted); padding: 12px 6px; font-weight: 900; font-size: 15.5px; border-radius: 999px; transition: background .18s, color .18s; }
.seg button[aria-pressed="true"] { background: var(--g-signature); color: #fff; box-shadow: 0 8px 20px -8px rgba(220,50,200,.75), inset 0 1px 0 rgba(255,255,255,.3); }
.section-label { font-weight: 900; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 6px 4px 0; }

/* ---------- game card ---------- */
.stage { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; min-height: 0; }
.card {
  --g: var(--g-signature); --glow: rgba(210,50,200,.55);
  --tx: #fff; --tx2: #fff; --panel: rgba(28,6,58,.34); --chipbg: rgba(255,255,255,.17); --chipbd: rgba(255,255,255,.45);
  --hl: rgba(30,5,60,.34); --mk: #FFE04A; --pill-ink: #1A0F2E;
  --tube: rgba(255,255,255,.62); --tglow: rgba(255,255,255,.7); --tglow2: rgba(255,255,255,.32);
  position: relative; isolation: isolate; overflow: hidden;
  border-radius: var(--r-xl); color: var(--tx);
  background: radial-gradient(90% 55% at 12% 0%, rgba(255,255,255,.14), transparent 60%), var(--g);
  display: flex; flex-direction: column; gap: 18px; padding: 0 0 26px;
  box-shadow: 0 28px 70px -22px var(--glow), 0 0 46px -10px var(--glow), inset 0 2px 0 rgba(255,255,255,.4), inset 0 0 0 1px rgba(255,255,255,.14);
  animation: cardIn .42s cubic-bezier(.25,.9,.35,1) both;
}
.stage > .card { flex: 1 0 auto; min-height: min(520px, 52vh); }
.stage > .card > :nth-child(2) { margin-top: auto; }
.stage > .card > :last-child { margin-bottom: auto; }
/* SIGNATURE: the game's symbol as a neon tube sign */
.card::before {
  content: var(--glyph, "*"); position: absolute; z-index: -1; right: 12px; bottom: 18px; pointer-events: none;
  font-family: var(--display); font-weight: 900; font-size: 215px; line-height: .8; letter-spacing: -.06em;
  color: transparent; -webkit-text-stroke: 3px var(--tube);
  filter: drop-shadow(0 0 7px var(--tglow)) drop-shadow(0 0 22px var(--tglow2));
  transform: rotate(10deg); transform-origin: 70% 70%;
}
.card.alt::before { transform: rotate(-8deg); }
.card::after { content: ""; order: 99; flex: 0 0 92px; pointer-events: none; }
/* carte trop haute pour l'écran (fitStage) : on retire le vide décoratif, puis on réduit les textes */
.stage > .card.tight { min-height: 0; gap: 12px; padding-bottom: 18px; }
.stage > .card.tight::after { flex-basis: 0 !important; }
.stage > .card.tighter .text { font-size: clamp(22px, 6.6vw, 28px) !important; }
.stage > .card.tighter .who { font-size: clamp(40px, 12vw, 52px); }
.stage > .card.tighter .sub { font-size: 16px !important; }
.stage > .card.tighter .pts-rule { font-size: 13px; padding: 8px 12px; }
.stage > .card:has(.vs)::after, .stage > .card:has(.timer)::after { flex-basis: 40px; }
.stage > .card:has(.chips)::after { flex-basis: 12px; }
.card[style*="--radar"] { --glyph: "%"; --g: linear-gradient(165deg, #22D3EE 0%, #6366F1 55%, #7C3AED 100%); --glow: rgba(70,140,255,.65); --pill-ink: #4F46E5; }
.card[style*="--rank"] { --glyph: "1."; --g: linear-gradient(165deg, #FFB03A 0%, #FF7A1A 55%, #E2480E 100%); --glow: rgba(255,120,30,.6); --pill-ink: #C2410C; }
.card[style*="--yesno"] { --glyph: "O"; --g: linear-gradient(165deg, #2DD4BF 0%, #14A89A 55%, #0E7C86 100%); --glow: rgba(30,200,180,.55); --pill-ink: #0F766E; }
.card[style*="--violet"] { --glyph: "!"; --g: var(--g-uv); --glow: rgba(130,60,255,.7); --pill-ink: #5A22E0; }
.card[style*="--violet"]::before { right: 34px; font-size: 205px; }
.card[style*="--red"] { --glyph: "?"; --g: var(--g-sunset); --glow: rgba(255,50,110,.65); --pill-ink: #D0105E; }
.card[style*="--blue"] { --glyph: "≠"; --g: var(--g-blue); --glow: rgba(50,110,255,.7); --pill-ink: #2D5BFF; }
.card[style*="--ink"] { --glyph: "VS"; --g: var(--g-magenta); --glow: rgba(220,60,215,.62); --pill-ink: #A01A9E; }
.card[style*="--ink"]::before { font-size: 150px; bottom: 26px; }
.card[style*="--yellow"], .card[style*="--green"] {
  --tx: var(--ink); --tx2: #24163F; --panel: rgba(255,255,255,.45); --chipbg: rgba(255,255,255,.5); --chipbd: rgba(26,15,46,.18);
  --hl: rgba(26,15,46,.86); --mk: #FF3577; --pill-ink: var(--ink);
  --tube: rgba(255,255,255,.92); --tglow: rgba(255,110,0,.75); --tglow2: rgba(255,80,0,.35);
}
.card[style*="--green"] { --tglow: rgba(0,130,150,.7); --tglow2: rgba(0,110,140,.3); }
.card[style*="--yellow"] { --glyph: "?!"; --g: var(--g-gold); --glow: rgba(255,170,40,.55); }
.card[style*="--yellow"]::before { font-size: 185px; }
.card[style*="--green"] { --glyph: "#"; --g: var(--g-mint); --glow: rgba(30,220,190,.5); }
.card:not([style*="--"]) { --pill-ink: #A01A9E; }

.card .band { padding: 20px 22px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--tx); }
.card .band .mast {
  font-size: 13.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1;
  background: #fff; color: var(--pill-ink); padding: 9px 14px 8px; border-radius: 999px; min-width: 0;
  box-shadow: 0 6px 16px -8px rgba(30,0,60,.5);
}
/* intensity badge: flames instead of ✱ (text kept for screen readers, drawn as flames) */
.card .band .eyebrow {
  position: relative; flex: none; height: 34px; padding: 8px 12px; border-radius: 999px; background: var(--hl);
  font-size: 1px; line-height: 18px; letter-spacing: 16px; color: transparent; overflow: hidden;
}
.card .band .eyebrow::before {
  content: ""; position: absolute; inset: 8px 12px; background: var(--mk);
  -webkit-mask: var(--flame) left center / 14.5px 18px; mask: var(--flame) left center / 14.5px 18px;
  -webkit-mask-repeat: space no-repeat; mask-repeat: space no-repeat;
}
.card .who { font-family: var(--display); font-weight: 800; font-size: clamp(56px, 17vw, 76px); line-height: 1; letter-spacing: -.03em; padding: 0 22px; overflow-wrap: anywhere; }
.card .who small { display: block; font-family: var(--body); font-size: 14px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px; opacity: .95; line-height: 1.2; }
/* petits écrans (Safari avec ses barres) : tout doit tenir sans faire défiler */
@media (max-height: 760px) {
  .card::after { flex-basis: 34px !important; }
  .card .text { font-size: clamp(26px, 7.8vw, 34px) !important; }
  #app { gap: 12px; padding-block: 8px calc(14px + env(safe-area-inset-bottom, 0px)); }
}
.card .text { font-size: clamp(30px, 9.2vw, 40px); line-height: 1.16; font-weight: 900; padding: 0 22px; text-wrap: pretty; overflow-wrap: break-word; letter-spacing: -.01em; }
.stage > .card:has(.chips) .text { font-size: clamp(28px, 8.4vw, 36px); }
.stage > .card:has(.chip:nth-child(6)) .text { font-size: clamp(26px, 7.4vw, 32px); }
.stage > .card:has(.chip:nth-child(6)) .sub { font-size: 18px; }
.card .text b { font-weight: 900; text-decoration: underline .13em var(--mk); text-underline-offset: .16em; text-decoration-skip-ink: none; }
.card .sub { padding: 0 22px; font-size: 20px; line-height: 1.36; font-weight: 700; color: var(--tx2); }
.card .sub[style*="--ink"] { color: var(--tx) !important; font-size: 15px !important; font-weight: 900 !important; letter-spacing: .12em !important; text-transform: uppercase; }
/* Tu préfères: the band already says it */
.card[style*="--ink"] > .sub[style*="--ink"] { display: none; }
.card .chips { padding: 0 22px !important; }
.card .chip.pick { background: var(--chipbg); border-color: var(--chipbd); color: var(--tx); }
.card .chip.pick[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.card[style*="--violet"] .chip.pick[aria-pressed="true"], .card[style*="--rank"] .chip.pick[aria-pressed="true"], .card[style*="--yesno"] .chip.pick[aria-pressed="true"], .card[style*="--red"] .chip.pick[aria-pressed="true"],
.card[style*="--blue"] .chip.pick[aria-pressed="true"], .card[style*="--ink"] .chip.pick[aria-pressed="true"], .card:not([style]) .chip.pick[aria-pressed="true"] { background: #fff; color: #1A0F2E; border-color: #fff; }
.card .chip.pick[aria-pressed="true"]::before { content: "✓"; font-weight: 900; }
.card .row { padding: 0 22px !important; }
.card .btn.white { --bg: rgba(255,255,255,.22); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6); }
.vs { display: flex; flex-direction: column; gap: 0; padding: 0 22px; align-items: stretch; }
.vs .opt-a, .vs .opt-b {
  border-radius: var(--r-l); padding: 20px 18px; font-size: 22px; font-weight: 900; line-height: 1.24; text-wrap: pretty;
  background: #fff; color: var(--ink); box-shadow: 0 10px 24px -12px rgba(40,0,60,.6);
}
.vs .opt-a { padding-bottom: 26px; }
/* Tu préfères : pourcentages des autres groupes */
.vs [data-o] { position: relative; overflow: hidden; transition: opacity .3s, transform .15s; }
.vs [data-o]:active { transform: scale(.98); }
.vs [data-o]::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 0; background: var(--yellow); transition: width .8s cubic-bezier(.2,.8,.3,1); }
.vs.done [data-o]::before { width: var(--p, 0%); }
.vs [data-o] > span { position: relative; }
.vs .pct { display: block; margin-top: 4px; font-family: var(--display); font-size: 28px; color: var(--ink); animation: pop .3s ease-out; }
.vs .opt-b { padding-top: 26px; }
/* Oui ou non : les deux réponses côte à côte, même remplissage caché que Tu préfères */
.vs.ovs { flex-direction: row; gap: 12px; margin-top: 4px; }
.vs.ovs .opt-a, .vs.ovs .opt-b { flex: 1; padding: 16px 10px; text-align: center; font-size: 22px; }
.vs .or {
  align-self: center; margin: -14px 0; z-index: 1; width: 58px; height: 58px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 16px; text-transform: uppercase;
  background: var(--yellow); color: var(--ink); box-shadow: 0 0 0 5px rgba(160,26,158,.55), 0 0 22px rgba(255,224,74,.6);
}
.penalty { margin: 0 22px; border-radius: var(--r-l); padding: 14px 18px; font-weight: 800; font-size: 18px; line-height: 1.36; background: var(--panel); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); color: var(--tx); }
.penalty .eyebrow { display: block; margin-bottom: 5px; font-size: 13px; opacity: .92; }
.pts-rule { margin: 0 22px; padding: 10px 14px; border-radius: var(--r-s); background: rgba(0,0,0,.18); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); font-size: 14px; font-weight: 800; line-height: 1.35; color: #fff; }
.card[style*="--yellow"] .pts-rule, .card[style*="--green"] .pts-rule { background: rgba(255,255,255,.4); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(26,15,46,.12); }

/* Le Radar */
.dial-box { margin: 0 18px; touch-action: none; user-select: none; -webkit-user-select: none; }
.dial { width: 100%; display: block; overflow: visible; }
.dial .needle { stroke: #fff; stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
.dial .hub { fill: #fff; }
.dial .rz { fill: #fff; font-family: var(--display); font-weight: 900; font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
.radar-res { margin: 0 18px; display: flex; flex-direction: column; gap: 6px; }
.radar-res div { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,.2); font-weight: 900; }
.radar-res i { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
.radar-res .guide i { background: transparent; box-shadow: inset 0 0 0 2px #fff; }
.radar-res span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.poles { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 8px; font-weight: 900; font-size: 17px; line-height: 1.18; }
/* les deux extrêmes : pastilles bien contrastées, une couleur par côté */
.poles span { flex: 0 1 auto; max-width: 64%; padding: 7px 12px; border-radius: 14px; color: #fff; background: rgba(14,6,40,.72); border: 2px solid #5EE7FF; box-shadow: 0 0 16px -4px rgba(94,231,255,.8); text-shadow: 0 1px 2px rgba(0,0,0,.5); overflow-wrap: normal; word-break: normal; hyphens: manual; }
.poles span + span { text-align: right; border-color: #FF5FA2; box-shadow: 0 0 16px -4px rgba(255,95,162,.85); }
.radar-hold .dial-box { cursor: pointer; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.radar-hold .dial-box * { pointer-events: none; }
.card.radc .dial { width: min(100%, 40vh); margin: 0 auto; }
.card.radc .who { font-size: min(13vw, 64px); overflow-wrap: normal; word-break: normal; hyphens: manual; }
@media (max-height: 760px) { .impx.radx { gap: 8px; padding: 22px 18px; } .impx.radx .big { font-size: 72px; } .impx.radx .dial-box .dial { width: min(100%, 34vh); } }
@media (max-height: 700px) { .card.radc .who { font-size: min(11vw, 46px); } .card.radc .sub { font-size: 17px; } .card.radc .dial { width: min(100%, 34vh); } }
@media (max-height: 620px) { .card.radc::after { flex-basis: 0 !important; } .card.radc .who { font-size: 38px !important; } .card.radc { gap: 8px; } .card.radc .dial { width: min(100%, 26vh); } .card.radc .who small { display: none; } .card.radc .sub { font-size: 15px; line-height: 1.3; } .card.radc .poles { font-size: 14px; margin-top: 4px; } .card.radc .poles span { padding: 4px 9px; }
  .impx.radx { padding: 18px 16px; gap: 6px; } .impx.radx .big { font-size: 60px; } .impx.radx .ln { font-size: 16px; } .impx.radx .dial-box .dial { width: min(100%, 27vh); } }
.impx.radx .dial-box { width: 100%; margin: 6px 0 0; } .impx.radx .dial { width: min(100%, 40vh); margin: 0 auto; }
.impx.radx .poles { font-size: 17px; overflow-wrap: normal; word-break: normal; hyphens: manual; }
.impx.radx .ttl { overflow-wrap: normal; word-break: normal; hyphens: manual; }
/* roue du mode Mix */
.skip-rank { display: flex; justify-content: center; padding: 6px 0; }
.skip-rank .btn { width: auto; padding: 12px 22px; }
.wheel-stage { align-items: center; gap: 22px; }
.wheel-box { position: relative; width: min(84vw, 340px); aspect-ratio: 1; }
/* le halo reste fixe : une ombre sur la roue qui tourne dessinait un carré lumineux sur iPhone */
.wheel-glow { position: absolute; inset: -6%; border-radius: 50%; background: radial-gradient(closest-side, rgba(170,70,255,.55), rgba(255,59,110,.22) 70%, transparent); filter: blur(14px); pointer-events: none; transition: opacity .6s; }
.wheel-box.on .wheel-glow { opacity: .55; }
.wheel { position: relative; width: 100%; height: 100%; display: block; transition: transform 3.6s cubic-bezier(.12,.72,.08,1); cursor: pointer; will-change: transform; }
.wheel .wl { fill: #fff; font-family: var(--body); font-weight: 900; font-size: 12px; paint-order: stroke; stroke: rgba(10,5,30,.3); stroke-width: 2px; }
.wheel .wrim { fill: #1B1040; stroke: rgba(255,255,255,.9); stroke-width: 2; }
.wheel .wsep { stroke: rgba(11,7,32,.55); stroke-width: 2; }
.wheel .wbulb { fill: #FFF3C4; }
.wheel .wbulb.b2 { fill: #FFC94D; }
.wheel-box.on .wbulb { animation: bulb .5s steps(1) infinite; }
.wheel-box.on .wbulb.b2 { animation-delay: .25s; }
@keyframes bulb { 50% { fill: rgba(255,255,255,.35); } }
.wheel-hub { position: absolute; left: 50%; top: 50%; width: 17%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3A2A7A, #0B0720 70%); box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 4px 14px rgba(0,0,0,.5); pointer-events: none; }
.wheel-pin { position: absolute; left: 50%; top: -12px; width: 30px; height: 40px; margin-left: -15px; z-index: 2; filter: drop-shadow(0 3px 6px rgba(0,0,0,.55)); pointer-events: none; }
.wheel-pin::before { content: ""; position: absolute; inset: 0; background: linear-gradient(#FFFFFF, #E4DCFF); clip-path: polygon(50% 100%, 0 26%, 12% 6%, 50% 0, 88% 6%, 100% 26%); }
.wheel-res { margin: 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.15; min-height: 62px; }
.wheel-res small { display: block; font-family: var(--body); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
/* classement */
.rank { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }
.rank-head { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.rank-head .mast { font-size: 38px; }
.rank-date { color: var(--muted); font-weight: 800; font-size: 14px; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; }
.pod { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.pod-name { font-family: var(--display); font-weight: 800; font-size: 17px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod-pts { color: var(--muted); font-weight: 900; font-size: 14px; }
.pod-step { width: 100%; border-radius: var(--r-s) var(--r-s) 6px 6px; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--ink); margin-top: 6px; }
.pod.r1 .pod-step { height: 150px; background: linear-gradient(165deg, #FFEC6E, #FFB32E); box-shadow: 0 10px 40px -8px rgba(255,190,40,.7); }
.pod.r2 .pod-step { height: 112px; background: linear-gradient(165deg, #F2F3FF, #B9BEDD); }
.pod.r3 .pod-step { height: 86px; background: linear-gradient(165deg, #FFC08A, #F07A3A); }
.pod.r1 .pod-name { font-size: 20px; }
.rank-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rank-list li { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--r-l); background: var(--glass); box-shadow: inset 0 0 0 1px var(--hair); }
.rank-list .rk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); font-weight: 900; font-size: 15px; flex: none; }
.rank-list .nm { flex: 1; font-weight: 900; font-size: 17px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-list b { font-family: var(--display); font-size: 18px; }
.mini-rank { display: flex; flex-direction: column; gap: 4px; max-height: 26vh; overflow-y: auto; }
.mini-rank div { display: flex; justify-content: space-between; padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,.06); font-weight: 800; color: #fff; }


@keyframes cardIn {
  0% { transform: translateY(34px) scale(.9) rotate(-2.5deg); opacity: 0; }
  55% { transform: translateY(-6px) scale(1.015) rotate(.6deg); opacity: 1; }
  80% { transform: translateY(2px) scale(.998) rotate(-.15deg); }
  100% { transform: none; opacity: 1; }
}
.stamp {
  position: fixed; left: 50%; top: 42%; z-index: 50; pointer-events: none;
  font-family: var(--display); font-weight: 900; font-size: clamp(24px, 7.6vw, 38px); line-height: 1.04; letter-spacing: -.01em;
  text-transform: uppercase; text-align: center;
  color: #fff; width: max-content; max-width: calc(100vw - 48px); white-space: normal; overflow-wrap: normal; hyphens: none;
  padding: 16px 22px; border-radius: var(--r-l); border: 3px solid var(--red);
  background: rgba(14,6,36,.9);
  text-shadow: 0 0 2px #fff, 0 0 10px var(--red), 0 0 26px rgba(255,59,110,.6);
  box-shadow: 0 0 24px var(--red), inset 0 0 20px rgba(255,59,110,.45);
  transform: translate(-50%,-50%) rotate(-7deg); animation: stamp .42s cubic-bezier(.2,1.5,.4,1) both;
}
.stamp.green { border-color: var(--green); text-shadow: 0 0 2px #fff, 0 0 10px var(--green), 0 0 26px rgba(46,230,160,.6); box-shadow: 0 0 24px var(--green), inset 0 0 20px rgba(46,230,160,.4); }
.stamp.blue { border-color: var(--blue); text-shadow: 0 0 2px #fff, 0 0 10px var(--blue), 0 0 26px rgba(77,139,255,.6); box-shadow: 0 0 24px var(--blue), inset 0 0 20px rgba(77,139,255,.45); }
@keyframes stamp {
  0% { transform: translate(-50%,-50%) rotate(-7deg) scale(1.9); opacity: 0; }
  45% { opacity: 1; }
  60% { transform: translate(-50%,-50%) rotate(-7deg) scale(.94); }
  100% { transform: translate(-50%,-50%) rotate(-7deg) scale(1); opacity: 1; }
}

.rule-banner {
  border-radius: var(--r-l); background: var(--g-gold); color: var(--ink); padding: 12px 14px; font-weight: 800; font-size: 16px; line-height: 1.3;
  display: flex; gap: 10px; align-items: baseline; box-shadow: 0 10px 26px -14px rgba(255,180,40,.7);
}
.rule-banner > span:last-child { text-wrap: pretty; }
.rule-banner .eyebrow { flex: none; background: var(--ink); color: var(--yellow); padding: 4px 9px; border-radius: 999px; }
.progress {
  font-weight: 900; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums;
  background: var(--glass); border: 1px solid var(--hair); padding: 9px 16px; border-radius: 999px; text-align: center; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* petits iPhone : « Carte 12 » doit tenir à côté de « ⟳ Changer » */
@media (max-width: 400px) { .topbar { gap: 8px; } .progress { padding: 9px 10px; letter-spacing: .03em; } .changebtn { padding: 0 12px; } }

.big-count {
  position: relative; z-index: 1;
  font-family: var(--display); font-weight: 900; font-size: 180px; line-height: 1; text-align: center; color: #fff;
  text-shadow: 0 0 3px #fff, 0 0 14px var(--red), 0 0 46px rgba(255,59,110,.7);
  animation: pop .4s cubic-bezier(.2,1.5,.4,1) both; letter-spacing: -.04em;
}
.big-count[style] { font-size: clamp(34px, 11vw, 46px) !important; text-transform: uppercase; letter-spacing: 0; }
.stage:has(.big-count)::before, .stage:has(.big-count)::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; pointer-events: none;
  border: 3px solid rgba(255,140,190,.75);
  box-shadow: 0 0 14px rgba(255,59,110,.8), inset 0 0 14px rgba(255,59,110,.6);
  animation: ring .75s ease-out infinite;
}
.stage:has(.big-count)::after { width: 220px; height: 220px; margin: -110px 0 0 -110px; border-color: rgba(255,255,255,.18); box-shadow: none; animation: none; background: radial-gradient(closest-side, rgba(255,59,110,.28), transparent); }
@keyframes ring { 0% { transform: scale(.82); opacity: 1; } 100% { transform: scale(1.18); opacity: 0; } }
@keyframes pop { 0% { transform: scale(1.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.timer { font-family: var(--display); font-weight: 900; font-size: 104px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.04em; text-shadow: 0 0 30px rgba(255,255,255,.45); }
.bar { height: 14px; border-radius: 999px; background: rgba(255,255,255,.16); margin: 0 22px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.25); }
.card .bar { background: rgba(20,5,60,.3); }
.bar i { display: block; height: 100%; min-width: 14px; border-radius: 999px; background: #fff; box-shadow: 0 0 14px rgba(255,255,255,.7); transition: width 1s linear; }
/* test: the "n / 25" pill already says it, drop the duplicate track */
#app > .bar { display: none; }

.secret {
  position: relative; overflow: hidden; border-radius: var(--r-xl); color: #fff; padding: 34px 22px; text-align: center;
  display: flex; flex-direction: column; justify-content: center; gap: 14px;
  border: 2px solid transparent;
  background: linear-gradient(#150D38, #0F0A2A) padding-box, var(--g-signature) border-box;
  box-shadow: 0 0 50px -12px rgba(200,60,230,.7), 0 0 0 1px rgba(255,255,255,.04);
  animation: cardIn .42s cubic-bezier(.25,.9,.35,1) both;
}
.stage > .secret { flex: 1 0 auto; min-height: min(440px, 56vh); }
.secret::before { content: ""; position: absolute; inset: -40% -20% auto; height: 70%; background: radial-gradient(closest-side, rgba(170,70,255,.3), transparent); pointer-events: none; }
.secret::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -380px 0 0 -380px; pointer-events: none; z-index: 0;
  background: repeating-radial-gradient(circle, transparent 0 58px, rgba(190,120,255,.09) 58px 61px);
  -webkit-mask: radial-gradient(closest-side, #000 30%, transparent); mask: radial-gradient(closest-side, #000 30%, transparent);
}
.secret > * { position: relative; z-index: 1; }
/* L'Imposteur : le mot n'apparaît que pendant qu'on garde le doigt dessus */
.imphold { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.imphold * { pointer-events: none; }
.imphold .imp-cue { font-size: 18px; opacity: .8; }
.imphold .imp-face { position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #130C34; border-radius: inherit; }
.imphold.on .imp-face { display: flex; }
.imphold.on > :not(.imp-face) { visibility: hidden; }
/* même taille pour tous les mots (et « L'imposteur ») : jamais coupés au milieu */

.cface { position: absolute; inset: 0; border-radius: calc(var(--s) * .2); background: linear-gradient(145deg, #fff 0%, #ECE6FF 100%); display: grid; grid-template-columns: repeat(3, 1fr); padding: calc(var(--s) * .14); gap: calc(var(--s) * .05); box-shadow: inset 0 0 0 2px rgba(123,51,245,.18), inset 0 -5px 0 rgba(60,20,120,.1); -webkit-backface-visibility: hidden; backface-visibility: hidden; }

.cface.f6 { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.cface.f2 { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.cface.f5 { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.cface.f3 { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }

.tool-hint { text-align: center; margin: 0; font-size: 13.5px; font-weight: 800; color: var(--muted); min-height: 18px; }

.tool-opts .seg { margin: 0; }
.tool-opts .seg button { padding: 10px 4px; font-size: 14px; white-space: nowrap; }
.chooser { position: relative; flex: 1; margin: 0 12px; border-radius: 28px; border: 2px dashed rgba(255,255,255,.2); background: radial-gradient(circle at 50% 50%, rgba(123,51,245,.14), transparent 70%); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: grid; place-items: center; overflow: hidden; transition: border-color .3s, background .3s; }

.finger { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; pointer-events: none; transition: transform .55s cubic-bezier(.3,1.5,.5,1), opacity .5s; animation: fin .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes fin { from { transform: scale(.2); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.finger .core { position: absolute; left: 27px; top: 27px; width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--fc) 55%, #fff), var(--fc) 62%); box-shadow: 0 0 0 6px color-mix(in srgb, var(--fc) 30%, transparent), 0 0 38px var(--fc); animation: pulse 1s ease-in-out infinite; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 34px; color: #0B0720; }
.finger::after { content: ""; position: absolute; left: 27px; top: 27px; width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--fc); animation: ping 1.4s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .8 } to { transform: scale(1.55); opacity: 0 } }
.finger .ring { position: absolute; inset: 0; width: 150px; height: 150px; transform: rotate(-90deg); overflow: visible; }
.finger .ring circle { fill: none; stroke: var(--fc); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377; filter: drop-shadow(0 0 6px var(--fc)); }
.finger.count .ring circle { animation: ringgo var(--ct, 2200ms) linear forwards; }
@keyframes ringgo { to { stroke-dashoffset: 0 } }
@keyframes pulse { 50% { transform: scale(1.12) } }
.finger.win { transform: scale(1.7); z-index: 2; animation: none; transition: transform .55s cubic-bezier(.3,1.5,.5,1), left .7s ease, top .7s ease; }
.finger.win.solo { left: 50% !important; top: 50% !important; }
.finger.win .core { animation: halo 1.1s ease-in-out infinite; }
.finger.win .ring { opacity: 0; }
.finger.win::after { animation: ping .9s ease-out infinite; }
@keyframes halo { 0%,100% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--fc) 35%, transparent), 0 0 40px var(--fc), 0 0 70px var(--fc) } 50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--fc) 25%, transparent), 0 0 60px var(--fc), 0 0 90px var(--fc) } }

/* Écran d'ouverture */
#splash { position: fixed; inset: 0; z-index: 9999; background: #0B0720; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .4s ease, visibility .4s; overflow: hidden; }
#splash::before { content: ""; position: absolute; width: 120vmax; height: 120vmax; left: 50%; top: 50%; margin: -60vmax 0 0 -60vmax; background: radial-gradient(circle at 30% 30%, rgba(255,59,110,.28), transparent 38%), radial-gradient(circle at 70% 65%, rgba(123,51,245,.38), transparent 40%), radial-gradient(circle at 55% 25%, rgba(255,178,31,.16), transparent 30%); animation: splspin 9s linear infinite; }
#splash.out { opacity: 0; visibility: hidden; pointer-events: none; }
#splash .spl-logo { position: relative; font-family: "Unbounded", "Arial Rounded MT Bold", "Arial Black", sans-serif; font-weight: 900; font-size: clamp(54px, 19vw, 96px); letter-spacing: -.035em; line-height: 1.1; padding: 0 .08em; background: linear-gradient(100deg, #FFB21F 0%, #FF3B6E 45%, #7B33F5 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 22px rgba(255,59,110,.55)); animation: splin .75s cubic-bezier(.2,1.5,.4,1) both; }

#splash .spl-dots i { width: 12px; height: 12px; border-radius: 50%; animation: spldot 1s ease-in-out infinite; }
#splash .spl-dots i:nth-child(1) { background: #FF3B6E; box-shadow: 0 0 14px #FF3B6E; }
#splash .spl-dots i:nth-child(2) { background: #FFB21F; box-shadow: 0 0 14px #FFB21F; animation-delay: .15s; }
#splash .spl-dots i:nth-child(3) { background: #2EE6A0; box-shadow: 0 0 14px #2EE6A0; animation-delay: .3s; }
#splash .spl-dots i:nth-child(4) { background: #7B33F5; box-shadow: 0 0 14px #7B33F5; animation-delay: .45s; }
@keyframes splin { from { transform: scale(.55) rotate(-4deg); opacity: 0 } to { transform: scale(1) rotate(0); opacity: 1 } }
@keyframes spldot { 50% { transform: translateY(-9px) scale(1.2) } }
@keyframes splspin { to { transform: rotate(360deg) } }

@keyframes rFly { 0% { transform: translate(-50%, 0) scale(.6); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), -70px) scale(1.2); opacity: 0; } }

/* Vide ta main (ex-Uno) : look proche du Uno pour qu'on comprenne direct (couleurs, bord blanc, joker noir), sans l'ovale ni le nom */
.uno { position: relative; width: var(--cw, 60px); height: calc(var(--cw, 60px) * 1.45); flex: none; border-radius: calc(var(--cw, 60px) * .14); border: calc(var(--cw, 60px) * .06) solid #fff; padding: 0; background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,0) 40%, rgba(0,0,0,.18)), var(--uc); color: #fff; font-family: var(--display); font-weight: 900; display: grid; place-items: center; box-shadow: 0 6px 14px -6px rgba(0,0,0,.7); transition: transform .15s; }

.tile.rt::after { font-size: 58px; bottom: auto; top: 8px; right: 6px; }
.tile[data-mode="taboo"] { --tglyph: "✕"; --tg: linear-gradient(165deg, #FF4F7E 0%, #E0245E 55%, #A8113F 100%); --tgl: rgba(230,40,95,.55); }
.tile[data-mode="p4"] { --tglyph: "4"; --tg: linear-gradient(165deg, #FF5A7A 0%, #FF3B6E 50%, #C8124F 100%); --tgl: rgba(255,60,110,.55); }
.tile[data-mode="uno"] { --tglyph: "+2"; --tg: linear-gradient(165deg, #FFE04A 0%, #FFC93C 50%, #F59E0B 100%); --tf: var(--ink); --tgl: rgba(255,200,60,.45); --tglow: rgba(255,110,0,.7); }
.tile[data-mode="deux"] { --tglyph: "&"; --tg: linear-gradient(165deg, #A66BFF 0%, #7B33F5 60%, #5A1FD0 100%); }
.tile[data-mode="reflexe"] { --tglyph: "⚡"; --tg: linear-gradient(165deg, #4D8BFF 0%, #2F6BFF 55%, #2340C8 100%); --tgl: rgba(60,110,255,.55); }

.tabbar-space { height: 92px; flex: none; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; max-width: 480px; margin: 0 auto; background: rgba(20,13,51,.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,.1); padding: 6px 6px max(10px, env(safe-area-inset-bottom, 0px)); }
.tabbar > button { position: relative; border: 0; background: none; color: var(--muted); font-weight: 800; font-size: 12px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.tabbar > button.on { color: #FF3B6E; font-weight: 900; }

.tab-mix:active { transform: scale(.94); }

/* accueil calé sur la maquette E : tuiles unies, texte en bas */
.home-head .logo { background: none; -webkit-text-fill-color: #FF3B6E; color: #FF3B6E; filter: none; font-size: 30px; }
.tile.rt { width: 128px; height: 150px; border-radius: 20px; padding: 14px; box-shadow: none; background: var(--rc); color: var(--rf, #fff); }

.tile.rt[data-mode="av"] { --rc: #FFB21F; --rf: #1A0F2E; }
.tile.rt[data-mode="pref"] { --rc: #C51FB6; }
.tile.rt[data-mode="ouinon"] { --rc: #14B8A6; --rf: #062A26; }
.tile.rt[data-mode="classement"] { --rc: #FF8A1F; --rf: #1A0F2E; }

.tile.rt[data-mode="p4"] { --rc: #FF3B6E; }
.tile.rt[data-mode="uno"] { --rc: #FFC93C; --rf: #1A0F2E; }

.rail-title { font-family: Unbounded, var(--display); font-weight: 700; font-size: 17px; }
.where-seg { background: #1E1545; border: 0; padding: 3px; }
.where-seg button[aria-pressed="true"] { background: #F6F3FF; color: #0B0720; box-shadow: none; }
.where-seg button { min-height: 40px; padding: 0 8px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }

.tile.rt .ill { position: absolute; top: 12px; right: 10px; font-size: 52px; line-height: 1; transform: rotate(8deg); filter: drop-shadow(0 6px 10px rgba(0,0,0,.28)); pointer-events: none; }
.rail-box.short .tile.rt .ill { font-size: 42px; top: 10px; }
.idea-in { width: 100%; box-sizing: border-box; border-radius: 18px; border: 2px solid var(--hair); background: rgba(255,255,255,.07); color: var(--paper); font: 700 17px Nunito, sans-serif; padding: 14px; resize: none; -webkit-user-select: text; user-select: text; }
.jstack > .card.under { position: absolute; inset: 0; z-index: 0; margin: 0; animation: none; pointer-events: none; filter: brightness(.62); }
/* paquet de cartes : deux tranches fixes sous la pile, elles ne bougent jamais d'une carte à l'autre */
.jstack { isolation: isolate; }
.jstack::before, .jstack::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -7px; height: 40px; border-radius: 0 0 var(--r-xl) var(--r-xl); background: rgba(255,255,255,.13); z-index: -1; pointer-events: none; }
.jstack::after { left: 28px; right: 28px; bottom: -13px; background: rgba(255,255,255,.07); z-index: -2; }
.jstack > .card.top { z-index: 1; }
/* la carte du dessus est déjà sur sa propre couche : le premier geste et « Suivante » partent sans à-coup */
.jstack > .card.top.swipe { will-change: transform; }
/* le symbole néon (deux drop-shadow) sur sa propre couche : il coûtait la moitié du dessin de chaque nouvelle carte */
.jstack > .card::before { will-change: transform; }
.jstack > .card.under > .under-shade { position: absolute; inset: 0; z-index: 9; border-radius: inherit; background: #000; opacity: .38; pointer-events: none; will-change: opacity; }
.card .qcount { margin: 4px auto 0; min-width: 120px; padding: 10px 22px; border-radius: 99px; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: var(--paper); font: 900 18px Nunito, sans-serif; letter-spacing: .04em; cursor: pointer; transition: transform .15s; }
/* Qui pourrait : carte duel, deux prénoms au-dessus de la question */
.card .qduel { margin: 0 22px; align-self: flex-start; max-width: calc(100% - 44px); padding: 8px 16px 9px; border-radius: 18px; background: #fff; color: #EE1F66; font: 900 22px/1.15 var(--display), sans-serif; box-shadow: 0 10px 24px -12px rgba(30,0,60,.6); }
.card .qduel span { display: block; font: 900 11.5px/1.3 Nunito, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #6A5F90; }
.card .qduel i { font-style: normal; font-family: Nunito, sans-serif; font-size: 16px; color: #6A5F90; }
.card .qcount.on { transform: scale(1.25); background: rgba(255,255,255,.95); color: #EE1F66; border-color: transparent; }
.card.swipe, .card.swipe * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.jstack > .card.top.still { animation: none; }
.card .avpick { display: flex; gap: 12px; padding: 0 22px; margin-top: auto; }
.card .avpick button { flex: 1; padding: 20px 0; border-radius: 20px; border: 2px solid var(--chipbd); background: var(--panel); color: var(--tx); font: 900 22px var(--display), sans-serif; cursor: pointer; transition: transform .15s; }
.card .avk { display: contents; }
.card .avk > .avfor { margin-top: auto; }
/* Action ou vérité : carte coupée en deux, bleu côté vérité (gauche), rose côté action (droite) */
.jstack .card.avw { --tx: #fff; --tx2: #fff; --panel: rgba(28,6,58,.34); --chipbg: rgba(255,255,255,.17); --chipbd: rgba(255,255,255,.45); --hl: rgba(30,5,60,.34); --mk: #FFE04A; --pill-ink: var(--ink); --tube: rgba(255,255,255,.62); --tglow: rgba(255,255,255,.7); --tglow2: rgba(255,255,255,.32); }
.jstack .card.avduo { --g: linear-gradient(165deg, #FF7A45 0%, #FF3577 40%, #C0105C 100%) right / 50% 100% no-repeat, var(--g-blue) left / 50% 100% no-repeat; --glow: rgba(150,70,255,.6); }
.jstack .card.av-v, .jstack .card.avq.show-v { --g: var(--g-blue); --glow: rgba(60,110,255,.6); }
.jstack .card.av-a, .jstack .card.avq.show-a { --g: var(--g-sunset); --glow: rgba(255,53,119,.6); }
.jstack .card.av-t { --g: var(--g-signature); --glow: rgba(210,50,200,.55); }
.jstack .card.avduo .who { margin: auto 22px 0; padding: 18px 20px 20px; border-radius: var(--r-l); background: #fff; color: var(--ink); text-align: center; font-size: clamp(40px, 12vw, 60px); box-shadow: 0 18px 40px -14px rgba(30,0,60,.55); }
.jstack .card.avduo .who small { color: #6A5F90; }
.jstack .card.avduo .avpick button { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.6); color: #fff; }
.jstack .card.avduo > .card-rate { visibility: hidden; } /* pas de vote sur « Au tour de » : la place reste, les boutons ne se voient jamais */
.jstack .card.avduo .avgroupe { text-align: center; padding: 0 22px; }
.card .avgroupe { margin: -4px 0 0; font-weight: 800; }
.card.show-v .avk[data-k="a"], .card.show-a .avk[data-k="v"] { display: none; }
.jstack > .card.under.avq.peek .avother { visibility: visible; }
/* la carte de la question, dessous, reste entièrement cachée tant qu'on ne tire pas : rien ne transparaît pendant l'arrivée de la carte du dessus */
.jstack > .card.under.avq:not(.peek) { visibility: hidden; }
.card .avpick button:active, .card .avother:active { transform: scale(.96); }
.card .avfor { margin: 0; padding: 0 22px; font-size: 16px; font-weight: 800; opacity: .95; }
.card .avfor b { font-family: var(--display); font-size: 22px; }
.card .avother { margin: auto auto 0; padding: 9px 20px; border-radius: 99px; border: 2px solid var(--chipbd); background: var(--chipbg); color: var(--tx); font: 800 15px Nunito, sans-serif; cursor: pointer; }
.jstack > .card.under .avother { visibility: hidden; }
.card.swipe { touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; cursor: grab; }
.card .swipe-tag { position: absolute; top: 64px; z-index: 3; padding: 4px 14px; border: 4px solid; border-radius: 14px; font-family: var(--display); font-size: 34px; font-weight: 900; letter-spacing: .04em; opacity: 0; pointer-events: none; background: rgba(11,7,32,.35); }
.card .swipe-tag.oui { left: 18px; color: #2EE6A0; border-color: #2EE6A0; transform: rotate(-12deg); }
.card .swipe-tag.non { right: 18px; color: #FF5A82; border-color: #FF5A82; transform: rotate(12deg); }
.card .swipe-hint { display: flex; justify-content: space-between; margin: 4px 0 0; padding: 0 22px; font-size: 17px; font-weight: 900; opacity: .85; }
.actions.duo-btns { flex-direction: row; }
.actions.duo-btns .btn { flex: 1; }
.on-choices { display: flex; flex-direction: column; gap: 10px; margin: 6px 0; }
.on-choices .btn { min-height: 56px; }
.on-games .chip.pick { font-size: 15px; min-height: 44px; padding: 8px 14px; }
/* ---------- mini tuto des règles ---------- */
.tuto-wrap { position: fixed; inset: 0; z-index: 80; background: rgba(6,3,18,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease-out both; }
.tuto { width: 100%; max-width: 520px; max-height: 66vh; max-height: 66dvh; gap: 14px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; gap: 8px;
  background: linear-gradient(180deg, #1D1447 0%, #0B0720 100%); color: var(--text); border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: 0 -18px 60px -16px rgba(255,59,110,.6), 0 -2px 0 rgba(255,59,110,.7), inset 0 1px 0 rgba(255,255,255,.16);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up .26s cubic-bezier(.25,1.2,.4,1) both; }
.tuto-head { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tuto-head b { color: var(--yellow); font-weight: 900; }
.tuto-track { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; margin: 0 -4px; }
.tuto-track::-webkit-scrollbar { display: none; }
.tuto-step { flex: 0 0 100%; box-sizing: border-box; scroll-snap-align: center; scroll-snap-stop: always; padding: 8px 6px; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; text-align: center; }
.tuto-ico { flex: none; width: 96px; height: 96px; border-radius: 28px; display: grid; place-items: center; font-size: 54px; background: var(--glass-2); box-shadow: inset 0 0 0 1.5px var(--hair), 0 0 24px -6px rgba(255,59,110,.7); }

.tuto-dots { display: flex; justify-content: center; gap: 7px; }
.tuto-dots i { width: 9px; height: 9px; border-radius: 99px; background: rgba(255,255,255,.28); transition: all .2s; }
