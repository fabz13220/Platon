/* -------- PUISSANCE 4 : deux joueurs sur le même écran -------- */
const P4 = { wins: [0, 0], first: 0 };
function p4Start() {
  const names = S.duo, R = 6, W = 7;
  const g = Array.from({ length: R }, () => Array(W).fill(-1));
  let cur = P4.first, over = false, line = null, last = null;
  const win = (r, c) => {
    const p = g[r][c];
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const cells = [[r, c]];
      for (const s of [1, -1]) { let rr = r + dr * s, cc = c + dc * s; while (rr >= 0 && rr < R && cc >= 0 && cc < W && g[rr][cc] === p) { cells.push([rr, cc]); rr += dr * s; cc += dc * s; } }
      if (cells.length >= 4) return cells;
    }
    return null;
  };
  const draw = () => {
    const full = g[0].every(x => x >= 0);
    const msg = line ? `<b class="p4c p${cur}"></b>${esc(names[cur])} gagne !` : full ? "Match nul" : `<b class="p4c p${cur}"></b>Au tour de ${esc(names[cur])}`;
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">${esc(names[0])} ${P4.wins[0]} - ${P4.wins[1]} ${esc(names[1])}</span><span style="width:44px"></span></div>
      <p class="p4-msg">${msg}</p>
      <div class="p4" id="p4">${Array.from({ length: W }, (_, c) => `<button class="p4col" data-c="${c}" aria-label="Colonne ${c + 1}">${Array.from({ length: R }, (_, r) => {
        const v = g[r][c], hl = line && line.some(([a, b]) => a === r && b === c), drop = last && last[0] === r && last[1] === c;
        return `<i class="${v >= 0 ? "p" + v : ""}${hl ? " hl" : ""}${drop ? " drop" : ""}" style="--r:${r + 1}"></i>`;
      }).join("")}</button>`).join("")}</div>
      <div class="actions">${over ? `<div class="row"><button class="btn red" id="again">Revanche</button><button class="btn white" id="home">Accueil</button></div>` : ""}</div>
    `, () => {
      bindQuit();
      if (over) { $("#again").onclick = p4Start; $("#home").onclick = home; return; }
      $$(".p4col").forEach(b => b.onclick = () => {
        const c = +b.dataset.c; let r = R - 1; while (r >= 0 && g[r][c] >= 0) r--;
        if (r < 0) { buzz([20, 30, 20]); return; }
        g[r][c] = cur; last = [r, c]; buzz(15);
        line = win(r, c);
        if (line) { over = true; P4.wins[cur]++; P4.first = 1 - cur; buzz([60, 40, 120]); }
        else if (g[0].every(x => x >= 0)) { over = true; P4.first = 1 - P4.first; }
        else cur = 1 - cur;
        draw();
      });
    });
  };
  draw();
}

/* -------- UNO : on se passe le téléphone, chacun voit sa main en secret -------- */
const UNO_COLS = { r: "#FF3B6E", y: "#FFC93C", g: "#2EE6A0", b: "#4D8BFF" };
const UNO_NAMES = { r: "rouge", y: "jaune", g: "vert", b: "bleu" };
function unoDeck() {
  const d = [];
  for (const c of "rygb") {
    d.push({ c, v: "0" });
    for (const v of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "skip", "rev", "+2"]) d.push({ c, v }, { c, v });
  }
  for (let i = 0; i < 4; i++) d.push({ c: "w", v: "w" }, { c: "w", v: "+4" });
  return shuffle(d);
}
const unoLabel = v => ({ skip: "⊘", rev: "⇄", w: "★" }[v] || v);
const unoCard = (k, cls = "", i) => `<button class="uno ${k.c === "w" ? "wild" : ""} ${cls}" ${i != null ? `data-i="${i}"` : ""} style="--uc:${UNO_COLS[k.c] || "#1A0F2E"}"><span>${unoLabel(k.v)}</span></button>`;
function unoStart() {
  if (S.names.length > 10) { toast("10 joueurs maximum au Uno."); return; }
  const P = shuffle(S.names).map(n => ({ name: n, hand: [] }));
  let pile = unoDeck(), disc = [], color, dir = 1, cur = 0, log = "", locked = false;
  const pick = () => { if (!pile.length) { const top = disc.pop(); pile = shuffle(disc); disc = [top]; } return pile.pop(); };
  P.forEach(p => { for (let i = 0; i < 7; i++) p.hand.push(pick()); });
  let first = pick(); while (first.c === "w") { pile.unshift(first); first = pick(); }
  disc.push(first); color = first.c;
  const top = () => disc[disc.length - 1];
  const nextIdx = (n = 1) => ((cur + dir * n) % P.length + P.length) % P.length;
  const ok = k => k.c === "w" || k.c === color || k.v === top().v;
  // effet de la première carte
  if (first.v === "skip") { log = `${P[0].name} passe son tour.`; cur = nextIdx(); }
  else if (first.v === "rev") { dir = -1; if (P.length === 2) cur = nextIdx(); }
  else if (first.v === "+2") { P[0].hand.push(pick(), pick()); log = `${P[0].name} pioche 2 cartes.`; cur = nextIdx(); }
  const table = () => `<div class="uno-table">
      <div class="uno-top">${unoCard(top(), "big")}<span class="uno-col" style="background:${UNO_COLS[color]}">${UNO_NAMES[color]}</span></div>
      <div class="uno-players">${P.map((p, i) => `<span class="${i === cur ? "on" : ""}">${esc(p.name)} <b>${p.hand.length}</b></span>`).join("")}</div>
      ${log ? `<p class="uno-log">${esc(log)}</p>` : ""}
    </div>`;
  const turn = () => {
    const p = P[cur];
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">Uno ${dir > 0 ? "→" : "←"}</span><span style="width:44px"></span></div>
      ${table()}
      <div class="stage"><div class="secret"><span class="eyebrow" style="color:var(--paper)">Passe le téléphone à</span><span class="mast">${esc(p.name)}</span><p>Les autres, ne regardez pas ses cartes.</p></div></div>
      <div class="actions"><button class="btn" id="show">Je suis ${esc(p.name)}, voir mes cartes</button></div>
    `, () => { bindQuit(); $("#show").onclick = () => play(false); });
  };
  const play = drew => {
    const p = P[cur]; locked = false;
    const can = p.hand.some(ok);
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">Main de ${esc(p.name)}</span><span style="width:44px"></span></div>
      ${table()}
      <p class="sub" style="text-align:center;margin:0">${drew ? (can ? "Tu peux jouer une carte ou passer." : "Toujours rien, tu passes.") : can ? "Joue une carte en surbrillance." : "Aucune carte jouable : pioche."}</p>
      <div class="uno-hand">${p.hand.map((k, i) => unoCard(k, ok(k) ? "ok" : "no", i)).join("")}</div>
      <div class="actions">${drew ? `<button class="btn white" id="pass">Passer</button>` : `<button class="btn white" id="draw">Piocher</button>`}</div>
    `, () => {
      bindQuit();
      const d = $("#draw"); if (d) d.onclick = () => { if (locked) return; locked = true; const k = pick(); if (k) p.hand.push(k); buzz(10); play(true); };
      const ps = $("#pass"); if (ps) ps.onclick = () => { log = `${p.name} passe.`; cur = nextIdx(); turn(); };
      $$(".uno-hand .uno.ok").forEach(b => b.onclick = () => {
        const k = p.hand[+b.dataset.i];
        if (!k || locked) return; // pas de double carte sur un double appui
        if (k.c === "w") return chooseColor(col => { if (!locked) { locked = true; put(k, col); } });
        locked = true;
        put(k, k.c);
      });
    });
  };
  const chooseColor = then => sheet(`<span class="mast" style="font-size:28px">Quelle couleur ?</span>
    <div class="uno-colors">${Object.keys(UNO_COLS).map(c => `<button data-c="${c}" style="background:${UNO_COLS[c]}">${UNO_NAMES[c]}</button>`).join("")}</div>`,
    w => $$("[data-c]", w).forEach(b => b.onclick = () => { w.remove(); then(b.dataset.c); }));
  const put = (k, col) => {
    const p = P[cur];
    p.hand.splice(p.hand.indexOf(k), 1); disc.push(k); color = col; buzz(20);
    if (!p.hand.length) return end(p);
    log = `${p.name} a joué ${k.v === "w" ? "un joker" : k.v === "+4" ? "un +4" : k.v === "skip" ? "un passe-tour" : k.v === "rev" ? "un changement de sens" : k.v === "+2" ? "un +2" : "un " + k.v}${k.c === "w" ? " : " + UNO_NAMES[col] : ""}.`;
    if (p.hand.length === 1) { stamp("UNO !", "green"); log += ` ${p.name} n'a plus qu'une carte !`; }
    if (k.v === "rev") { dir = -dir; if (P.length === 2) cur = nextIdx(); }
    if (k.v === "skip") { cur = nextIdx(); log += ` ${P[cur].name} passe son tour.`; }
    if (k.v === "+2" || k.v === "+4") { cur = nextIdx(); const n = k.v === "+2" ? 2 : 4; for (let i = 0; i < n; i++) P[cur].hand.push(pick()); log += ` ${P[cur].name} pioche ${n} cartes et passe.`; }
    cur = nextIdx();
    later(turn, p.hand.length === 1 ? 900 : 250);
  };
  const end = p => {
    buzz([60, 40, 140]);
    view(`
      <div class="rank anim" id="rank"><div class="rank-head"><span class="mast">Uno</span></div>
        <p class="rank-say">Victoire de ${esc(p.name)}</p>
        <div class="tag win" style="align-self:center;font-size:18px">${esc(rnd(WIN_TAGS))}</div>
        <ol class="rank-list">${P.filter(x => x !== p).sort((a, b) => a.hand.length - b.hand.length).map((x, i) => `<li class="up"><span class="rk">${i + 2}</span><span class="nm">${esc(x.name)}</span><b>${x.hand.length} carte${x.hand.length > 1 ? "s" : ""}</b></li>`).join("")}</ol>
        <div class="confetti" id="confetti"></div></div>
      <div class="actions"><div class="row"><button class="btn red" id="again">Rejouer</button><button class="btn white" id="home">Accueil</button></div></div>
    `, () => { party(); $("#again").onclick = unoStart; $("#home").onclick = home; });
  };
  turn();
}

      ${rest.length ? `<ol class="rank-list">${rest.map(r => `<li><span class="rk">${r.rank}</span><span class="nm">${esc(r.name)}</span>${tag(r)}<b>${r.pts}</b></li>`).join("")}</ol>` : ""}

    </div>

    const say = t => { $("#say").textContent = t; };
    const steps = [];
    $$(".rank-list li").reverse().forEach(li => steps.push([450, () => { li.classList.add("up"); buzz(8); say("…"); }]));
    const pods = $$(".pod").sort((a, b) => b.dataset.rank - a.dataset.rank);
    const place = n => n === 1 ? "1re place" : n + "e place";
    pods.forEach((p, i) => {
      const r = +p.dataset.rank, last = i === pods.length - 1;
      if (last && pods.length > 1) steps.push([900, () => say(r === 1 ? "Et la première place revient à…" : place(r) + "…")]);
      steps.push([last ? 1500 : 900, () => {
        p.classList.add("up"); buzz(last ? [60, 40, 140] : 25); say(place(r));
        if (r === 1) { const w = st.filter(x => x.rank === 1).map(x => x.name); say(w.length > 1 ? "Égalité : " + w.slice(0, -1).join(", ") + " et " + w[w.length - 1] : "Victoire de " + w[0]); party(); }
      }]);
    });
    steps.push([700, () => $("#acts").classList.remove("wait")]);
    let k = 0, done = false;
    const run = () => { if (done || k >= steps.length) return; const [ms, fn] = steps[k++]; later(() => { fn(); run(); }, ms); };
    const finish = () => { if (done) return; done = true; clearTimers(); while (k < steps.length) steps[k++][1](); };
    $("#rank").onclick = finish;
    run();
  });
}

  ink: "#15130F", soft: "#5B554B", accent: "#E8322B", onAccent: "#FFFDF8", highlight: "#FFE24A", onHighlight: "#15130F",
  band: "#15130F", bandNum: "#FFE24A", bandText: "#FFFDF8", footer: "#E8322B", onFooter: "#FFFDF8",
  display: "Anton", displayWeight: "400", body: "Archivo", radius: 0, upper: true, shadowOffset: 14

function rr(x, X, Y, w, h, r) { x.beginPath(); if (r && x.roundRect) x.roundRect(X, Y, w, h, r); else x.rect(X, Y, w, h); }
async function renderRank(st) {
  const D = `"${STORY.display}", Impact, sans-serif`, B = `"${STORY.body}", Arial, sans-serif`, dw = STORY.displayWeight;
  try { await Promise.all([document.fonts.load(`${dw} 120px "${STORY.display}"`), document.fonts.load(`800 40px "${STORY.body}"`)]); } catch (e) {}
  const W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d"), M = 72;
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#1B0F4A"); g.addColorStop(1, "#0B0720");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.textAlign = "center"; x.fillStyle = "#FFFFFF"; x.font = `${dw} 120px ${D}`;
  x.fillText("Classement", W / 2, 260);
  x.fillStyle = "#C9C0F2"; x.font = `800 34px ${B}`; x.fillText(today(), W / 2, 330);
  const rows = st.slice(0, 12), top = 420, avail = H - 220 - top, rh = Math.min(190, avail / rows.length), y0 = top + Math.max(0, (avail - rh * rows.length) / 2) * .6;
  const medal = ["#FFD84A", "#D9DDF0", "#FF9A5A"];
  rows.forEach((r, i) => {
    const y = y0 + i * rh, h = rh - 18, podium = r.rank <= 3;
    x.fillStyle = podium ? "rgba(255,255,255,.12)" : "rgba(255,255,255,.06)"; rr(x, M, y, W - 2 * M, h, 32); x.fill();
    const cy = y + h / 2, rad = Math.min(46, h / 2 - 10);
    x.fillStyle = podium ? medal[r.rank - 1] : "rgba(255,255,255,.18)"; x.beginPath(); x.arc(M + 40 + rad, cy, rad, 0, 7); x.fill();
    x.fillStyle = podium ? "#1A0F2E" : "#FFFFFF"; x.font = `${dw} ${Math.round(rad * 1.1)}px ${D}`; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(String(r.rank), M + 40 + rad, cy + 2);
    x.textAlign = "left"; x.fillStyle = "#FFFFFF"; x.font = `${dw} ${Math.round(Math.min(64, h * .42))}px ${D}`;
    const nameW = W - 2 * M - 2 * rad - 300; let nm = r.name; while (x.measureText(nm).width > nameW && nm.length > 2) nm = nm.slice(0, -2) + "…";
    x.fillText(nm, M + 80 + 2 * rad, cy + 2);
    x.textAlign = "right"; x.fillStyle = podium ? medal[r.rank - 1] : "#C9C0F2"; x.font = `${dw} ${Math.round(Math.min(60, h * .4))}px ${D}`;
    x.fillText(r.pts + " pts", W - M - 40, cy + 2);
    x.textBaseline = "alphabetic";
  });
  x.textAlign = "center"; x.fillStyle = "#FF5C93"; x.font = `800 32px ${B}`; x.fillText("JOUÉ SUR PLATOZ", W / 2, H - 110);
  return new Promise(r => cv.toBlob(b => r({ blob: b, url: cv.toDataURL("image/png") }), "image/png"));
}
async function saveRank() {
  const btn = $("#save"); btn.disabled = true; btn.firstChild.textContent = "Préparation… ";
  const { blob, url } = await renderRank(lastRank);
  btn.disabled = false; btn.firstChild.textContent = "Enregistrer le classement ";
  let dl = null;
  try { dl = window.claude && window.claude.use ? await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 3000))]) : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: "platoz-classement.png", data: blob }); toast("Classement enregistré."); return; }
    catch (e) { if (e && e.code === "declined") return; }

}

/* image story des jeux seul ou à deux */
async function renderUne(A) {
  const D = `"${STORY.display}", Impact, sans-serif`, B = `"${STORY.body}", Arial, sans-serif`, dw = STORY.displayWeight;
  const up = t => STORY.upper ? String(t).toUpperCase() : String(t);
  try { await Promise.all([document.fonts.load(`${dw} 120px "${STORY.display}"`), document.fonts.load(`800 40px "${STORY.body}"`), document.fonts.load(`400 40px "${STORY.body}"`)]); } catch (e) {}
  const W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d"), M = 64, R = STORY.radius, so = STORY.shadowOffset;
  x.fillStyle = STORY.bg; x.fillRect(0, 0, W, H);
  if (STORY.dots) { x.fillStyle = STORY.dots; for (let i = 0; i < W; i += 14) for (let j = 0; j < H; j += 14) { x.beginPath(); x.arc(i, j, 1.6, 0, 7); x.fill(); } }
  // page
  if (so) { x.fillStyle = STORY.shadow; rr(x, M + so, 120 + so, W - 2 * M, H - 260, R); x.fill(); }
  x.save(); rr(x, M, 120, W - 2 * M, H - 260, R); x.clip();
  x.fillStyle = STORY.page; x.fillRect(M, 120, W - 2 * M, H - 260);
  // masthead
  x.fillStyle = STORY.accent; x.fillRect(M, 120, W - 2 * M, 230);
  x.fillStyle = STORY.onAccent; x.textAlign = "center"; x.font = `${dw} 190px ${D}`;
  let mw = x.measureText(up("Le Scandale")).width; if (mw > W - 2 * M - 60) x.font = `${dw} ${Math.floor(190 * (W - 2 * M - 60) / mw)}px ${D}`;
  x.fillText(up("Le Scandale"), W / 2, 312);
  x.fillStyle = STORY.line; x.fillRect(M, 350, W - 2 * M, 6);
  x.fillStyle = STORY.ink; x.font = `800 30px ${B}`; x.textAlign = "left"; x.fillText(today().toUpperCase(), M + 28, 404);
  x.textAlign = "right"; x.fillText(A.kicker && A.kicker !== "Exclusif" ? "ÉDITION SPÉCIALE" : "N° " + S.edition, W - M - 28, 404);
  x.fillStyle = STORY.line; x.fillRect(M, 428, W - 2 * M, 6);
  // kicker + headline
  let y = 500; x.textAlign = "left";
  x.font = `800 32px ${B}`; const kick = (A.kicker || "Exclusif").toUpperCase();
  x.fillStyle = STORY.highlight; rr(x, M + 28, y - 40, x.measureText(kick).width + 32, 54, R ? 27 : 0); x.fill();
  x.fillStyle = STORY.onHighlight; x.fillText(kick, M + 44, y);
  y += 120; x.fillStyle = STORY.ink; x.font = `${dw} 112px ${D}`;
  const hl = wrap(x, up(A.headline), W - 2 * M - 56).slice(0, 4);
  hl.forEach(l => { x.fillText(l, M + 28, y); y += 116; });
  x.font = `400 38px ${B}`; x.fillStyle = STORY.soft;
  wrap(x, A.deck, W - 2 * M - 56).slice(0, 3).forEach(l => { x.fillText(l, M + 28, y); y += 50; });
  y += 20; x.fillStyle = STORY.line; x.fillRect(M, y, W - 2 * M, 4); y += 60;
  // awards, two columns
  const colW = (W - 2 * M - 56 - 40) / 2, items = A.items.slice(0, 8);
  const statsTop = H - 200 - 170, rows = Math.ceil(items.length / 2);
  const rowH = Math.min(300, (statsTop - 30 - y) / rows), big = rowH >= 250;
  y += Math.max(0, (statsTop - 30 - y - rowH * rows) / 2);
  items.forEach((a, i) => {
    const cx = M + 28 + (i % 2) * (colW + 40), cy = y + Math.floor(i / 2) * rowH;

    x.fillStyle = STORY.ink; x.font = `${dw} ${big ? 84 : 64}px ${D}`; x.fillText(wrap(x, up(a.name), colW)[0], cx, cy + (big ? 92 : 70));
    x.fillStyle = STORY.soft; x.font = `400 ${big ? 32 : 28}px ${B}`;
    wrap(x, a.desc, colW).slice(0, 2).forEach((l, k) => x.fillText(l, cx, cy + (big ? 140 : 112) + k * (big ? 40 : 34)));
  });

  x.fillStyle = STORY.band; x.fillRect(M, statsTop, W - 2 * M, 170);
  const sw = (W - 2 * M) / 3;
  A.stats.forEach((st, i) => {
    const cx = M + sw * i + sw / 2; x.textAlign = "center";
    x.fillStyle = STORY.bandNum; x.font = `${dw} 96px ${D}`; x.fillText(String(st[0]), cx, statsTop + 100);
    x.fillStyle = STORY.bandText; x.font = `800 26px ${B}`; x.fillText(st[1].toUpperCase(), cx, statsTop + 145);

  x.fillStyle = STORY.footer; x.fillRect(M, H - 200, W - 2 * M, 60);
  x.fillStyle = STORY.onFooter; x.textAlign = "center"; x.font = `800 30px ${B}`; x.fillText("JOUÉ SUR PLATOZ · LE JEU DE TOUTES VOS SOIRÉES", W / 2, H - 160);

/* deux prénoms pour les jeux à deux */
function duoSetup(then) {
  const d = S.duo || store.get("duo", ["", ""]);
  view(`
    <div class="topbar"><button class="iconbtn" id="back" aria-label="Retour">←</button><span class="title">Qui joue ?</span><span style="width:44px"></span></div>
    <div class="opts">
      <input class="duo-in" id="duo-a" maxlength="14" placeholder="Joueur 1" autocomplete="off" autocapitalize="words" enterkeyhint="next" value="${esc(d[0])}" aria-label="Prénom du joueur 1">
      <input class="duo-in" id="duo-b" maxlength="14" placeholder="Joueur 2" autocomplete="off" autocapitalize="words" enterkeyhint="done" value="${esc(d[1])}" aria-label="Prénom du joueur 2">
    </div>
    <div class="actions"><button class="btn red" id="next">Continuer</button></div>
  `, () => {
    $("#back").onclick = home;
    const go = () => {
      const a = $("#duo-a").value.trim(), b = $("#duo-b").value.trim();
      if (!a || !b) { toast("Il faut deux prénoms."); return; }
      if (a.toLowerCase() === b.toLowerCase()) { toast("Deux prénoms différents, s'il vous plaît."); return; }
      store.set("duo", [a, b]); S.duo = [a, b]; then();
    };
    $("#next").onclick = go;
    $("#duo-a").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#duo-b").focus(); } };
    $("#duo-b").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go(); } };
  });
}

/* ---------- QUI DE NOUS DEUX ---------- */
function startDeux() {
  const lv = S.level;
  const qs = DEUX.filter(q => q[0] <= lv && (S.hot || !isHot([q[1]]))).map(q => ({ q, k: Math.random() + (q[0] === lv ? .35 : 0) })).sort((a, b) => b.k - a.k).slice(0, 15).map(o => o.q[1]);
  const st = { i: 0, ok: 0, qs, pts: { [S.duo[0]]: 0, [S.duo[1]]: 0 } };
  keepAwake();
  const ask = () => {
    if (st.i >= st.qs.length) return resultDeux(st);
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">Question ${st.i + 1} / ${st.qs.length}</span><span style="width:44px"></span></div>
      <div class="stage">${cardShell("deux", null, `
        <p class="text">Qui de nous deux <b>${esc(st.qs[st.i])}</b> ?</p>
        <p class="sub">Au signal, chacun pointe en même temps ${esc(S.duo[0])} ou ${esc(S.duo[1])}.</p>`, st.i % 2)}</div>
      <div class="actions"><button class="btn red" id="go">3, 2, 1… Désignez !</button></div>`, () => {
      bindQuit();
      $("#go").onclick = () => {
        let n = 3;
        $(".actions").innerHTML = "";
        const tick = () => {
          $(".stage").innerHTML = `<div class="big-count">${n > 0 ? n : "Pointez !"}</div>`;
          if (n <= 0) { $(".big-count").style.fontSize = "72px"; buzz(80); later(judge, 800); return; }
          buzz(20); n--; later(tick, 700);
        };
        tick();
      };
    });
  };
  const judge = () => {
    $(".stage").innerHTML = cardShell("deux", null, `<p class="text">Vous avez désigné la même personne ?</p>`, st.i % 2);
    $(".actions").innerHTML = `<div class="row"><button class="btn white" id="no">Non</button><button class="btn green" id="yes">Oui</button></div>`;
    $("#yes").onclick = () => {
      $(".stage").innerHTML = cardShell("deux", null, `<p class="text">Qui était-ce ?</p>
        <div class="row" style="padding:0 18px">${S.duo.map((n, i) => `<button class="btn white" data-i="${i}">${esc(n)}</button>`).join("")}</div>`, st.i % 2);
      $(".actions").innerHTML = "";
      $$(".stage [data-i]").forEach(b => b.onclick = () => { st.ok++; st.pts[S.duo[+b.dataset.i]]++; stamp("Complices", "green"); st.i++; later(ask, 900); });
    };
    $("#no").onclick = () => {
      stamp("Désaccord");
      later(() => {
        $(".stage").innerHTML = cardShell("deux", null, `<p class="text">Chacun a 20 secondes pour défendre sa version.</p>`, st.i % 2);
        $(".actions").innerHTML = `<button class="btn red" id="ok">Question suivante</button>`;
        $("#ok").onclick = () => { st.i++; ask(); };
      }, 900);
    };
  };
  ask();
}
function resultDeux(st) {
  const pct = Math.round(st.ok / st.qs.length * 100);
  const [a, b] = S.duo;
  const title = pct >= 80 ? "Âmes sœurs, ou complices du crime" : pct >= 60 ? "Un duo solide" : pct >= 40 ? "Ça se discute" : "Vous vous connaissez vraiment ?";
  const lead = st.pts[a] === st.pts[b] ? null : (st.pts[a] > st.pts[b] ? a : b);
  const A = {
    kicker: "Qui de nous deux",
    headline: `${a} et ${b} : complices à ${pct} %`,
    deck: title + ".",
    items: [
      { title: "Le plus désigné", name: lead || "Égalité", desc: lead ? `${Math.max(st.pts[a], st.pts[b])} fois sur ${st.ok} accords` : "Personne ne prend tout" },
      { title: "Verdict", name: pct >= 60 ? "Validé" : "À revoir", desc: `${st.ok} réponses communes sur ${st.qs.length}` }
    ],
    stats: [[st.qs.length, "questions"], [st.ok, "accords"], [st.qs.length - st.ok, "désaccords"]]
  };
  S.inGame = false;
  view(`${miniUne(A)}${resultActions()}`, () => { stamp(pct + " %", "blue"); bindResult(A, startDeux, "qui-de-nous-deux"); });
}

function reflexSolo() {
  const times = []; let state = "idle", t0 = 0, to = null;
  keepAwake();
  view(`<div class="pad" id="pad"><span class="pad-big" id="big">Touche pour commencer</span><span class="pad-small" id="small">Essai 1 / 5</span></div>
    <button class="iconbtn pad-quit" id="quit" aria-label="Quitter">×</button>`, () => {
    bindQuit();
    const pad = $("#pad"), big = $("#big"), small = $("#small");
    const set = (cls, b, s) => { pad.className = "pad " + cls; big.textContent = b; small.textContent = s; };
    const arm = () => { state = "wait"; set("wait", "Attends le rouge…", `Essai ${times.length + 1} / 5`); to = setTimeout(() => { state = "go"; t0 = performance.now(); set("go", "Tape !", ""); buzz(30); }, 1500 + Math.random() * 2500); timers.push(to); };
    pad.onpointerdown = e => {
      e.preventDefault();
      if (state === "idle" || state === "shown") return arm();
      if (state === "wait") { clearTimeout(to); state = "shown"; set("early", "Trop tôt !", "Touche pour réessayer"); buzz([60, 40, 60]); return; }
      if (state === "go") {
        const ms = Math.round(performance.now() - t0); times.push(ms); state = "shown";
        if (times.length >= 5) return done();
        set("idle", ms + " ms", "Touche pour l'essai suivant");
      }
    };
    const done = () => {
      const best = Math.min(...times), avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
      const rec = store.get("reflex-best", null), isRec = !rec || best < rec;
      if (isRec) store.set("reflex-best", best);
      const verdict = best < 220 ? "Réflexes de pilote de chasse" : best < 300 ? "Bien réveillé" : best < 400 ? "Correct, sans plus" : "Tu dors déjà ?";
      const name = store.get("solo-name", "") || (S.duo && S.duo[0]) || "";
      const A = { kicker: "Duel réflexe", headline: `${name ? name + " : " : "Réflexe : "}${best} ms`, deck: verdict + (isRec ? ". Nouveau record !" : "."), items: [],
        stats: [[best, "meilleur (ms)"], [avg, "moyenne (ms)"], [store.get("reflex-best", best), "record (ms)"]] };
      S.inGame = false;
      view(`${miniUne(A)}${resultActions()}`, () => { if (isRec) stamp("Record", "green"); bindResult(A, reflexSolo, "duel-reflexe"); });
    };
  });
}
function reflexDuo() {
  const [a, b] = S.duo, score = [0, 0];
  let state = "wait", to = null;
  keepAwake();
  view(`<div class="duel">
      <div class="half top" id="h1"><span class="pad-name">${esc(b)}</span><span class="pad-big" id="b1"></span><span class="pad-small" id="s1"></span></div>
      <div class="half" id="h0"><span class="pad-name">${esc(a)}</span><span class="pad-big" id="b0"></span><span class="pad-small" id="s0"></span></div>
    </div><button class="iconbtn pad-quit" id="quit" aria-label="Quitter">×</button>`, () => {
    bindQuit();
    const H = [$("#h0"), $("#h1")], B = [$("#b0"), $("#b1")], Sm = [$("#s0"), $("#s1")];
    const set = (cls, big, small) => [0, 1].forEach(i => { H[i].className = "half " + (i ? "top " : "") + cls; B[i].textContent = big[i]; Sm[i].textContent = small[i]; });
    const scoreTxt = () => [`${score[0]} - ${score[1]}`, `${score[1]} - ${score[0]}`];
    const round = () => {
      state = "wait"; set("wait", ["Attends…", "Attends…"], scoreTxt());
      to = setTimeout(() => { state = "go"; set("go", ["Tape !", "Tape !"], scoreTxt()); buzz(30); }, 1500 + Math.random() * 3000); timers.push(to);
    };
    const point = (w, why) => {
      state = "pause"; clearTimeout(to); score[w]++; buzz([40, 30, 40]);
      const msg = i => i === w ? (why === "early" ? "Faux départ adverse" : "Point !") : (why === "early" ? "Faux départ !" : "Trop lent");
      set("pause", [msg(0), msg(1)], scoreTxt());
      if (score[w] >= 3) { later(() => end(w), 1200); return; }
      later(round, 1500);
    };
    [0, 1].forEach(i => H[i].onpointerdown = e => {
      e.preventDefault();
      if (state === "go") point(i, "fast");
      else if (state === "wait") point(1 - i, "early");
    });
    const end = w => {
      const winner = S.duo[w], loser = S.duo[1 - w];
      const A = { kicker: "Duel réflexe", headline: `${winner} bat ${loser} ${score[w]} à ${score[1 - w]}`, deck: `Victoire en ${score[0] + score[1]} manches.`, items: [],
        stats: [[score[0] + score[1], "manches"], [score[w], "pour " + winner], [score[1 - w], "pour " + loser]] };
      S.inGame = false;
      view(`${miniUne(A)}${resultActions()}`, () => { stamp(winner.length > 9 ? "Victoire" : winner, "green"); bindResult(A, reflexDuo, "duel-reflexe"); });
    };
    round();
  });
}

/* ---------- TEST DE SCANDALE ---------- */
const testQs = () => TEST.filter(q => S.hot || !isHot(q));
function testIntro() {
  view(`
    <div class="topbar"><button class="iconbtn" id="back" aria-label="Retour">←</button><span class="title">Test de scandale</span><span style="width:44px"></span></div>
    <div class="stage">${cardShell("test", null, `
      <p class="text">${testQs().length} questions, réponds honnêtement. Tu obtiens ton indice de scandale, à partager si tu l'assumes.</p>
      <p class="sub">Personne ne voit tes réponses, seulement ton score et trois de tes aveux.</p>`)}</div>
    <input class="duo-in" id="solo-name" maxlength="14" placeholder="Ton prénom" autocomplete="off" autocapitalize="words" enterkeyhint="go" value="${esc(store.get("solo-name", ""))}" aria-label="Ton prénom">
    <div class="actions"><button class="btn red" id="go">Commencer</button></div>
  `, () => {
    $("#back").onclick = home;
    const go = () => { const n = $("#solo-name").value.trim(); if (!n) { toast("Entre ton prénom pour la Une."); return; } store.set("solo-name", n); testRun(n); };
    $("#go").onclick = go; $("#solo-name").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go(); } };
  });
}
function testRun(name) {
  const qs = shuffle(testQs()), yes = []; let i = 0;
  const ask = () => {
    if (i >= qs.length) return testResult(name, yes, qs.length);
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">${i + 1} / ${qs.length}</span><span style="width:44px"></span></div>
      <div class="bar" style="margin:0"><i style="width:${i / qs.length * 100}%;background:var(--red)"></i></div>
      <div class="stage">${cardShell("test", null, `<p class="text">${esc(qs[i][0])}</p>`, i % 2)}</div>
      <div class="actions"><div class="row"><button class="btn white" id="n">Non</button><button class="btn red" id="y">Oui</button></div></div>`, () => {
      bindQuit();
      $("#y").onclick = () => { yes.push(qs[i][1]); i++; ask(); };
      $("#n").onclick = () => { i++; ask(); };
    });
  };
  ask();
}
function testResult(name, yes, total) {
  const pct = Math.round(yes.length / total * 100);
  const title = pct <= 15 ? "Ange certifié" : pct <= 35 ? "Sage en apparence" : pct <= 55 ? "Suspect sous surveillance" : pct <= 75 ? "Scandale ambulant" : "Ennemi public n°1";
  const av = shuffle(yes).slice(0, 3);
  const A = {
    kicker: "Test de scandale",
    headline: `${name} scandaleux à ${pct} %`,
    deck: `Verdict de la rédaction : ${title}.`,
    items: av.map((t, k) => ({ title: "Aveu n°" + (k + 1), name: name, desc: name + " " + t })),
    stats: [[pct + "%", "indice"], [yes.length, "aveux"], [total - yes.length, "dénégations"]]
  };
  view(`${miniUne(A)}${resultActions()}`, () => { stamp(pct + " %", pct > 55 ? "" : "blue"); bindResult(A, () => testRun(name), "test-de-scandale"); });
}

/* ---------- image story générique ---------- */
async function saveStory(A, btn, file) {
  const label = btn.firstChild.textContent;
  btn.disabled = true; btn.firstChild.textContent = "Impression… ";
  const { blob, url } = await renderUne(A);
  btn.disabled = false; btn.firstChild.textContent = label;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 3000))]) : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: "platoz-" + file + ".png", data: blob }); toast("Image enregistrée. À poster !"); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  sheet(`<span class="mast" style="font-size:30px">Ton image</span>
    <p class="hint">Appuie longuement sur l'image pour l'enregistrer, puis poste-la en story.</p>
    <img class="preview-img" src="${url}" alt="La Une">
    <button class="btn" id="close">Fermer</button>`, w => { $("#close", w).onclick = () => w.remove(); });
}

home();
