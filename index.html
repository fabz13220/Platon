/* -------- construction du paquet -------- */
function pool(type) {
  const lv = S.level;
  const src = C[type];
  const all = src.map(c => ({ type, id: cardId(type, c), lvl: c[0], data: c }))
    .filter(c => c.lvl <= lv && (S.hot || !isHot(c.data.slice(1))));
  // les cartes retirées par le groupe ne reviennent plus (sauf s'il n'en reste presque plus)
  const kept = all.filter(c => !ban.has(c.id)), list = kept.length >= 3 ? kept : all;
  // priorité aux cartes jamais vues et au niveau choisi
  const fresh = list.filter(c => !used.has(c.id)), stale = list.filter(c => used.has(c.id));
  if (fresh.length < 3) list.forEach(c => used.delete(c.id));
  const sortByLevel = arr => arr.map(c => ({ c, k: Math.random() + (c.lvl === lv ? .35 : 0) })).sort((a, b) => b.k - a.k).map(o => o.c);
  return fresh.length < 3 ? sortByLevel(list) : sortByLevel(fresh).concat(shuffle(stale));
}
function deckOf(type, n) {
  if (type === "av") return Array.from({ length: n }, () => ({ type: "av" }));
  return pool(type).slice(0, n);
}

  const min = minPlayers();

    $("#chips").innerHTML = S.names.map((n, i) => `<span class="chip">${esc(n)}<button class="x" data-i="${i}" aria-label="Retirer ${esc(n)}">×</button></span>`).join("")
      || `<p class="hint muted">Ajoute au moins ${min} prénoms, ou touche un groupe.</p>`;
    $$("#chips .x").forEach(b => b.onclick = () => { S.names.splice(+b.dataset.i, 1); store.set("players", S.names); draw(); });
    const ok = S.names.length >= min;
    $("#next").disabled = !ok;
    $("#next").innerHTML = ok ? `Continuer <small>${S.names.length} joueurs</small>` : `Encore ${min - S.names.length} joueur${min - S.names.length > 1 ? "s" : ""}`;
  };
  view(`
    <div class="topbar"><button class="iconbtn" id="back" aria-label="Retour">←</button><span class="title">Qui joue ?</span><span style="width:44px"></span></div>
    <div class="field"><input id="name-input" maxlength="14" placeholder="Prénom" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-label="Prénom du joueur"><button class="btn" type="button" id="add">Ajouter</button></div>

    const add = () => {
      const v = $("#name-input").value.trim().replace(/\s+/g, " ");
      if (!v) return;
      if (S.names.some(n => n.toLowerCase() === v.toLowerCase())) { toast("Ce prénom est déjà dans la partie."); return; }
      if (S.names.length >= 16) { toast("16 joueurs maximum."); return; }

      o.el.style.translate = `${o.x.toFixed(1)}px ${o.y.toFixed(1)}px`;

function popGroup(b, g, draw) {
  const before = S.names.length;
  g.names.forEach(n => { if (S.names.length < 16 && !S.names.some(m => m.toLowerCase() === n.toLowerCase())) S.names.push(n); });
  const added = S.names.length - before;
  store.set("players", S.names);
  if (S.names.length >= 16 && added < g.names.length) toast("16 joueurs maximum.");
  buzz(20);
  if (calm()) { draw(); return; }
  const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  b.classList.add("pop");
  const cols = ["#FF3B7A", "#A66BFF", "#3E7BFF", "#FFC23D", "#fff"];
  for (let i = 0; i < 10; i++) {
    const p = document.createElement("i"), a = i / 10 * 6.283, d = 50 + Math.random() * 40;
    p.className = "spark"; p.style.background = cols[i % 5]; document.body.appendChild(p);
    p.animate([{ transform: `translate(${cx}px,${cy}px) scale(1)`, opacity: 1 }, { transform: `translate(${cx + Math.cos(a) * d}px,${cy + Math.sin(a) * d}px) scale(.2)`, opacity: 0 }], { duration: 520, easing: "ease-out" }).onfinish = () => p.remove();
  }
  draw();
  const chips = $$("#chips .chip").slice(before);
  chips.forEach((c, i) => {
    const t = c.getBoundingClientRect();

    c.animate([{ transform: `translate(${cx - t.left - t.width / 2}px,${cy - t.top - t.height / 2}px) scale(.2)`, opacity: 0 }, { opacity: 1, offset: .25 }, { transform: "none", opacity: 1 }], { duration: 500, delay: 120 + i * 70, easing: "cubic-bezier(.3,1.2,.5,1)", fill: "backwards" });

}

/* -------- LA ROUE (mode Mix) -------- */
function wheel(auto) {
  const games = WHEEL.filter(g => g.min <= S.players.length);
  const n = games.length, seg = 360 / n, R = 140, C0 = 150;
  const pt = (a, r) => { const t = (a - 90) * Math.PI / 180; return [C0 + r * Math.cos(t), C0 + r * Math.sin(t)]; };
  const slices = games.map((g, i) => {
    const a0 = i * seg, a1 = (i + 1) * seg, [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), mid = a0 + seg / 2, [tx, ty] = pt(mid, R * .6), ang = mid > 180 ? mid + 90 : mid - 90;
    return `<path d="M${C0},${C0} L${x0},${y0} A${R},${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1},${y1} Z" fill="${g.col}" stroke="#0B0720" stroke-width="3"/>
      <text x="${tx}" y="${ty}" transform="rotate(${ang} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle" class="wl">${esc(g.short)}</text>`;
  }).join("");
  view(`
    <div class="topbar">
      <button class="iconbtn" id="pause" aria-label="Pause">II</button>
      <span class="progress">Tour ${S.round + 1} / ${S.rounds}</span>
      <span style="width:44px"></span>
    </div>
    <div class="stage wheel-stage">
      <div class="wheel-box">
        <div class="wheel-pin"></div>
        <svg class="wheel" id="wheel" viewBox="0 0 300 300" aria-label="Roue des jeux">${slices}<circle cx="150" cy="150" r="26" fill="#0B0720" stroke="rgba(255,255,255,.35)" stroke-width="3"/></svg>
      </div>
      <p class="wheel-res" id="res">Lance la roue pour choisir le jeu.</p>
    </div>
    <div class="actions"><button class="btn red" id="spin">Lancer la roue</button></div>
  `, () => {
    $("#pause").onclick = pauseMenu;
    let spun = false;
    const spin = () => {
      if (spun) return; spun = true;
      const choices = games.map((g, i) => i).filter(i => games.length < 2 || games[i].t !== S.lastGame);
      const pick = rnd(choices), g = games[pick];
      const jitter = (Math.random() - .5) * seg * .6;
      const rot = 360 * 6 + (360 - (pick * seg + seg / 2)) + jitter;
      $("#spin").disabled = true; $("#res").textContent = "…";
      buzz(20); $("#wheel").style.transform = `rotate(${rot}deg)`;
      later(() => {
        buzz([40, 30, 60]);
        $("#res").innerHTML = `<small>On joue à</small>${esc(TYPES[g.t].label)}`;
        $(".actions").innerHTML = `<div class="row"><button class="btn white" id="respin">Relancer</button><button class="btn red" id="play">Jouer ${g.n > 1 ? `<small>${g.n} cartes</small>` : ""}</button></div>`;
        $("#respin").onclick = () => { S.lastGame = g.t; wheel(true); };
        $("#play").onclick = () => { S.changed = false; S.lastGame = g.t; S.deck = deckOf(g.t, g.n); S.idx = 0; if (!S.deck.length) return afterRound(); card(); };
      }, 3700);
    };
    $("#spin").onclick = spin; $("#wheel").onclick = spin;
    if (auto) later(spin, 60);
  });
}

// une seule nouvelle carte par tour, et c'est le même joueur qui la joue
function skipCard(msg, force) {
  if (S.changed && force !== true) { toast("Une seule nouvelle carte par tour."); return; }
  S.changed = true;
  if (S.avPick && S.avRedo) { const r = S.avRedo; S.avPick = null; toast("Nouvelle carte."); return r(); }
  S.avPick = null; S.avRedo = null;
  if (S.turnAt != null) turn = S.turnAt;
  const c = S.deck[S.idx], rep = c && c.type !== "av" ? pool(c.type).find(x => x.id !== c.id && !S.deck.some(d => d.id === x.id)) : (c ? { type: "av" } : null);
  if (rep) S.deck.splice(S.idx, 1, rep); else S.deck.splice(S.idx, 1);
  if (S.idx >= S.deck.length) return endDeck();
  toast(typeof msg === "string" ? msg : "Carte écartée."); card();
}
function next() {
  S.avPick = null; S.avRedo = null; S.changed = false;
  const c = S.deck[S.idx];
  if (c && c.id) { used.add(c.id); store.set("used", [...used]); }
  S.idx++;
  if (S.idx >= S.deck.length) return endDeck();
  card();
}
// jeux à un téléphone, sans points, qu'on swipe de carte en carte jusqu'à « Terminer »
const SWIPE = ["jamais", "pref", "qui", "av"];
function endDeck() {
  if (S.mode === "mix") return afterRound();
  if (SWIPE.includes(S.mode) && jamaisRefill()) return card(); // pas de nombre de cartes : on continue jusqu'à « Terminer »
  ranking();
}
// quand tout le paquet est passé, il repart sans reprendre les 20 dernières cartes
function jamaisRefill() {
  const recent = S.deck.slice(-20).map(d => d.id), all = deckOf(S.mode, 999);
  const more = all.filter(c => !recent.includes(c.id));
  S.deck.push(...(more.length ? more : all).slice(0, 40));
  return all.length > 0;
}
function card() {
  const c = S.deck[S.idx];
  if (!c) return endDeck();
  S.turnAt = turn;
  ({ jamais: cJamais, av: cAv, qui: cQui, pref: cPref, imposteur: cImposteur, menteur: cMenteur, radar: cRadar, classement: cClassement, ouinon: cOuinon })[c.type](c);
}
const alt = () => S.idx % 2 === 1;
const chipsHtml = () => `<div class="chips" style="padding:0 18px">${S.players.map((p, i) => `<button class="chip pick" data-i="${i}" aria-pressed="false">${esc(p.name)}</button>`).join("")}</div>`;

// carte qu'on jette d'un geste, à gauche ou à droite, pour passer à la suivante ; un petit coup sec suffit.
// La carte du dessous (under) grandit à mesure qu'on tire. Renvoie fly(sens) pour le bouton.
function swipeNext(el, under, onNext) {
  if (!el) return () => {};
  el.classList.add("swipe");
  let x0 = null, y0 = 0, dx = 0, done = false, pid = null, pts = [];
  const lift = (k, anim) => { // k : 0 = carte du dessous en attente, 1 = à sa place
    if (!under) return;
    under.style.transition = anim ? "transform .24s ease-out, filter .24s ease-out" : "none";
    under.style.filter = `brightness(${.62 + .38 * k})`;
  };
  const set = (d, anim) => {
    el.style.transition = anim ? "transform .24s cubic-bezier(.2,.9,.3,1.2)" : "none";
    el.style.transform = `translate3d(${d}px, ${Math.abs(d) * .06}px, 0) rotate(${d / 16}deg)`;
    lift(Math.min(1, Math.abs(d) / 180), anim);
  };
  const fly = dir => {
    if (done) return; done = true; buzz(10);
    const d = (dir > 0 ? 1 : -1) * (innerWidth + 260);
    el.style.transition = "transform .26s cubic-bezier(.3,.6,.5,1)";
    el.style.transform = `translate3d(${d}px, ${Math.abs(d) * .08}px, 0) rotate(${d / 14}deg)`;
    lift(1, true);
    setTimeout(onNext, 240);
  };
  el.addEventListener("pointerdown", e => { if (done || e.target.closest("button")) return; x0 = e.clientX; y0 = e.clientY; dx = 0; pid = e.pointerId; pts = [[e.clientX, e.timeStamp]]; el.style.animation = "none"; });
  el.addEventListener("pointermove", e => {
    if (x0 === null || e.pointerId !== pid) return;
    dx = e.clientX - x0;
    pts.push([e.clientX, e.timeStamp]); if (pts.length > 6) pts.shift();
    if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(e.clientY - y0)) { try { el.setPointerCapture(pid); } catch (er) {} }
    set(dx);
  });
  const end = () => {
    if (x0 === null) return; x0 = null;
    const [a, b] = [pts[0], pts[pts.length - 1]], v = b[1] > a[1] ? (b[0] - a[0]) / (b[1] - a[1]) : 0; // vitesse en px/ms

function avWho(x) {
  if (x.p) return x.p;
  if (!S.avBag || !S.avBag.length) {
    const b = shuffle(S.players);
    if (b.length > 1 && b[0] === S.avLast) b.push(b.shift());
    S.avBag = b;
  }
  return x.p = S.avLast = S.avBag.shift();

function cAvSwipe(c) {

  const p = avWho(c), slid = S.jSlid; S.jSlid = false;

  const draw = k => {
    const src = pool(k === "v" ? "verite" : "action"), pk = src.find(z => !c[k] || z.id !== c[k].pk.id) || src[0];
    if (pk) c[k] = { pk, txt: fill(pk.data[1], p) };
  };
  if (!c.v) draw("v"); if (!c.a) draw("a");
  const ask = (x, i) => cardShell("av", { label: "Au tour de", name: avWho(x).name }, `
    <div class="avpick"><button data-k="v">← Vérité</button><button data-k="a">Action →</button></div>`, i % 2 === 1);
  const quest = k => `<div class="avk" data-k="${k}">

  const qcard = ks => cardShell("av", null, `${ks.map(quest).join("")}<button class="avother">Autre carte</button>`, S.idx % 2 === 1);
  const nx = S.deck[S.idx + 1];

  const under = c.kind ? (nx ? ask(nx, S.idx + 1).replace('class="card ', 'class="card under ') : "")

  view(`${header()}

    <div class="actions"><div class="row"><button class="btn white" id="stop">Terminer</button><button class="btn red" id="ok">Suivante</button></div></div>`, () => {

/* -------- LE RADAR : une cible secrète sur une échelle, un indice, chacun place sa flèche -------- */
const RZ = [[4, 3], [10, 2], [16, 1]]; // écart maximal → points
const NEEDLE_COLS = ["#FFFFFF", "#FFE04A", "#2EE6A0", "#FF8FD0", "#7FD4FF", "#FFB34A", "#C7A6FF", "#A6FF8F"];
const zonePts = d => { const z = RZ.find(([w]) => d <= w); return z ? z[1] : 0; };
function dial(opts) {
  const cx = 150, cy = 152, r = 136;
  const P = (v, rad) => { const t = (180 - v * 1.8) * Math.PI / 180; return [cx + rad * Math.cos(t), cy - rad * Math.sin(t)]; };
  const wedge = (a, b, fill) => { a = Math.max(0, a); b = Math.min(100, b); const [x0, y0] = P(a, r), [x1, y1] = P(b, r); return `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${fill}"/>`; };
  const zones = opts.target == null ? "" : [[16, "#FFB34A"], [10, "#FF6A3D"], [4, "#FF2E7A"]].map(([w, f]) => wedge(opts.target - w, opts.target + w, f)).join("")
    + (() => { const [tx, ty] = P(opts.target, r - 22); return `<text x="${tx}" y="${ty}" class="rz">3</text>`; })();
  const needles = (opts.needles || (opts.needle == null ? [] : [{ v: opts.needle, col: "#FFFFFF" }]))
    .map(n => { const [nx, ny] = P(n.v, r - 10); return `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" class="needle" style="stroke:${n.col}"/>`; }).join("");
  return `<svg class="dial" viewBox="0 0 300 168" aria-hidden="true">
    ${wedge(0, 100, "rgba(255,255,255,.16)")}
    ${zones}${needles}
    ${needles ? `<circle cx="${cx}" cy="${cy}" r="11" class="hub"/>` : ""}
  </svg>`;
}
function dialBox(c, opts) {
  return `<div class="dial-box" id="dialbox">${dial(opts)}<div class="poles"><span>${esc(c.data[1])}</span><span>${esc(c.data[2])}</span></div></div>`;
}

      `)}</div>

/* -------- SANS LE DIRE : faire deviner un mot à son équipe sans dire les mots interdits -------- */
const TB = { teams: [[], []], score: [0, 0], turns: 0, max: 4, secs: 60, giver: [0, 0] };
const TB_NAMES = ["Équipe Feu", "Équipe Glace"], TB_COLS = ["#FF3B6E", "#4D8BFF"];
function tabooSetup() {

function tabooSplit() { const n = shuffle(S.names); TB.teams = [n.filter((_, i) => i % 2 === 0), n.filter((_, i) => i % 2 === 1)]; }
const tbCard = () => { if (!TB.deck || !TB.deck.length) TB.deck = shuffle(pool("taboo")); const c = TB.deck.pop(); used.add(c.id); store.set("used", [...used]); return c; };

function tabooPlay(t, g) {
  let left = TB.secs, c = tbCard(), passes = 0, over = false;
  const log = [];
  view(`
    <div class="topbar">${quitBtn()}<span class="tb-timer" id="timer">${left}</span><span class="progress" id="pts">+0</span></div>
    <div class="stage" id="stage"></div>
    <div class="tb-btns">
      <button class="btn white" id="pass">Passer <small id="pl">3 restants</small></button>

    </div>

  `, () => {
    bindQuit();
    const show = () => {
      const d = c.data;
      $("#stage").innerHTML = `<div class="card tb-card" style="--c:var(--taboo)">

      </div>`;
      const net = log.reduce((a, x) => a + (x.r === "ok" ? 1 : x.r === "no" ? -1 : 0), 0);
      $("#pts").textContent = (net >= 0 ? "+" : "") + net;
      $("#pl").textContent = passes >= 3 ? "plus de passe" : `${3 - passes} restant${3 - passes > 1 ? "s" : ""}`;
      $("#pass").disabled = passes >= 3;
    };
    const act = r => {

      log.push({ w: c.data[1], r });

      else if (r === "no") { buzz([80, 40, 80]); stamp("Interdit"); TB.score[t]--; }

    $("#ok").onclick = () => act("ok"); $("#no").onclick = () => act("no"); $("#pass").onclick = () => act("pass");
    show();
    const tick = setInterval(() => {

      el.textContent = left; el.classList.toggle("hot", left <= 10);
      if (left <= 10 && left > 0) buzz(8);
      if (left <= 0) { clearInterval(tick); over = true; buzz([200, 80, 200]); stamp("Temps écoulé"); later(() => tabooEnd(t, g, log), 900); }
    }, 1000);
    timers.push(tick);
  });
}
function tabooEnd(t, g, log) {
  const ok = log.filter(x => x.r === "ok").length, no = log.filter(x => x.r === "no").length, net = ok - no;
  TB.giver[t]++; TB.turns++;

  view(`

/* -------- PUISSANCE 4 : deux joueurs sur le même écran -------- */
const P4 = { wins: [0, 0], first: 0 };
function p4Start() {
  if (tutoGate("p4", p4Start)) return;
  stat("start", "p4", 2, "un");
  const names = S.duo, R = 6, W = 7;
  const g = Array.from({ length: R }, () => Array(W).fill(-1));
  let cur = P4.first, over = false, line = null, last = null;
  const win = (r, c) => {
    const p = g[r][c];
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const cells = [[r, c]];
      for (const s of [1, -1]) { let rr = r + dr * s, cc = c + dc * s; while (rr >= 0 && rr < R && cc >= 0 && cc < W && g[rr][cc] === p) { cells.push([rr, cc]); rr += dr * s; cc += dc * s; } }
      if (cells.length >= 4) return cells;
    }
    return null;
  };
  const draw = () => {
    const full = g[0].every(x => x >= 0);
    const msg = line ? `<b class="p4c p${cur}"></b>${esc(names[cur])} gagne !` : full ? "Match nul" : `<b class="p4c p${cur}"></b>Au tour de ${esc(names[cur])}`;
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">${esc(names[0])} ${P4.wins[0]} - ${P4.wins[1]} ${esc(names[1])}</span><span style="width:44px"></span></div>

/* -------- UNO : on se passe le téléphone, chacun voit sa main en secret -------- */
const UNO_COLS = { r: "#FF3B6E", y: "#FFC93C", g: "#2EE6A0", b: "#4D8BFF" };
const UNO_NAMES = { r: "rouge", y: "jaune", g: "vert", b: "bleu" };
function unoDeck() {
  const d = [];
  for (const c of "rygb") {
    d.push({ c, v: "0" });
    for (const v of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "skip", "rev", "+2"]) d.push({ c, v }, { c, v });
  }
  for (let i = 0; i < 4; i++) d.push({ c: "w", v: "w" }, { c: "w", v: "+4" });
  return shuffle(d);
}
const unoLabel = v => ({ skip: "⊘", rev: "⇄", w: "★" }[v] || v);
const unoCard = (k, cls = "", i) => `<button class="uno ${k.c === "w" ? "wild" : ""} ${cls}" ${i != null ? `data-i="${i}"` : ""} style="--uc:${UNO_COLS[k.c] || "#1A0F2E"}"><span>${unoLabel(k.v)}</span></button>`;
function unoStart() {
  if (S.names.length <= 10 && tutoGate("uno", unoStart)) return;
  if (S.names.length > 10) { toast("10 joueurs maximum au Uno."); return; }
  const P = shuffle(S.names).map(n => ({ name: n, hand: [] }));
  stat("start", "uno", P.length, "un");
  let pile = unoDeck(), disc = [], color, dir = 1, cur = 0, log = "", locked = false;
  const pick = () => { if (!pile.length) { const top = disc.pop(); pile = shuffle(disc); disc = [top]; } return pile.pop(); };
  P.forEach(p => { for (let i = 0; i < 7; i++) p.hand.push(pick()); });
  let first = pick(); while (first.c === "w") { pile.unshift(first); first = pick(); }
  disc.push(first); color = first.c;
  const top = () => disc[disc.length - 1];
  const nextIdx = (n = 1) => ((cur + dir * n) % P.length + P.length) % P.length;
  const ok = k => k.c === "w" || k.c === color || k.v === top().v;
  // effet de la première carte
  if (first.v === "skip") { log = `${P[0].name} passe son tour.`; cur = nextIdx(); }
  else if (first.v === "rev") { dir = -1; if (P.length === 2) cur = nextIdx(); }
  else if (first.v === "+2") { P[0].hand.push(pick(), pick()); log = `${P[0].name} pioche 2 cartes.`; cur = nextIdx(); }
  const table = () => `<div class="uno-table">
      <div class="uno-top">${unoCard(top(), "big")}<span class="uno-col" style="background:${UNO_COLS[color]}">${UNO_NAMES[color]}</span></div>
      <div class="uno-players">${P.map((p, i) => `<span class="${i === cur ? "on" : ""}">${esc(p.name)} <b>${p.hand.length}</b></span>`).join("")}</div>
      ${log ? `<p class="uno-log">${esc(log)}</p>` : ""}
    </div>`;
  const turn = () => {
    const p = P[cur];
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">Uno ${dir > 0 ? "→" : "←"}</span><span style="width:44px"></span></div>
      ${table()}
      <div class="stage"><div class="secret"><span class="eyebrow" style="color:var(--paper)">Passe le téléphone à</span><span class="mast">${esc(p.name)}</span><p>Les autres, ne regardez pas ses cartes.</p></div></div>
      <div class="actions"><button class="btn" id="show">Je suis ${esc(p.name)}, voir mes cartes</button></div>
    `, () => { bindQuit(); $("#show").onclick = () => play(false); });
  };
  const play = drew => {
    const p = P[cur]; locked = false;
    const can = p.hand.some(ok);
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">Main de ${esc(p.name)}</span><span style="width:44px"></span></div>
      ${table()}
      <p class="sub" style="text-align:center;margin:0">${drew ? (can ? "Tu peux jouer une carte ou passer." : "Toujours rien, tu passes.") : can ? "Joue une carte en surbrillance." : "Aucune carte jouable : pioche."}</p>
      <div class="uno-hand">${p.hand.map((k, i) => unoCard(k, ok(k) ? "ok" : "no", i)).join("")}</div>
      <div class="actions">${drew ? `<button class="btn white" id="pass">Passer</button>` : `<button class="btn white" id="draw">Piocher</button>`}</div>
    `, () => {
      bindQuit();
      const d = $("#draw"); if (d) d.onclick = () => { if (locked) return; locked = true; const k = pick(); if (k) p.hand.push(k); buzz(10); play(true); };
      const ps = $("#pass"); if (ps) ps.onclick = () => { log = `${p.name} passe.`; cur = nextIdx(); turn(); };
      $$(".uno-hand .uno.ok").forEach(b => b.onclick = () => {
        const k = p.hand[+b.dataset.i];
        if (!k || locked) return; // pas de double carte sur un double appui
        if (k.c === "w") return chooseColor(col => { if (!locked) { locked = true; put(k, col); } });
        locked = true;
        put(k, k.c);
      });
    });
  };
  const chooseColor = then => sheet(`<span class="mast" style="font-size:28px">Quelle couleur ?</span>
    <div class="uno-colors">${Object.keys(UNO_COLS).map(c => `<button data-c="${c}" style="background:${UNO_COLS[c]}">${UNO_NAMES[c]}</button>`).join("")}</div>`,
    w => $$("[data-c]", w).forEach(b => b.onclick = () => { w.remove(); then(b.dataset.c); }));
  const put = (k, col) => {
    const p = P[cur];
    p.hand.splice(p.hand.indexOf(k), 1); disc.push(k); color = col; buzz(20);
    if (!p.hand.length) return end(p);
    log = `${p.name} a joué ${k.v === "w" ? "un joker" : k.v === "+4" ? "un +4" : k.v === "skip" ? "un passe-tour" : k.v === "rev" ? "un changement de sens" : k.v === "+2" ? "un +2" : "un " + k.v}${k.c === "w" ? " : " + UNO_NAMES[col] : ""}.`;
    if (p.hand.length === 1) { stamp("UNO !", "green"); log += ` ${p.name} n'a plus qu'une carte !`; }
    if (k.v === "rev") { dir = -dir; if (P.length === 2) cur = nextIdx(); }
    if (k.v === "skip") { cur = nextIdx(); log += ` ${P[cur].name} passe son tour.`; }
    if (k.v === "+2" || k.v === "+4") { cur = nextIdx(); const n = k.v === "+2" ? 2 : 4; for (let i = 0; i < n; i++) P[cur].hand.push(pick()); log += ` ${P[cur].name} pioche ${n} cartes et passe.`; }
    cur = nextIdx();
    later(turn, p.hand.length === 1 ? 900 : 250);
  };
  const end = p => {
    stat("end", "uno", P.length, "un");
    buzz([60, 40, 140]);
    view(`
      <div class="rank anim" id="rank"><div class="rank-head"><span class="mast">Uno</span></div>
        <p class="rank-say">Victoire de ${esc(p.name)}</p>
        <ol class="rank-list">${P.filter(x => x !== p).sort((a, b) => a.hand.length - b.hand.length).map((x, i) => `<li class="up"><span class="rk">${i + 2}</span><span class="nm">${esc(x.name)}</span><b>${x.hand.length} carte${x.hand.length > 1 ? "s" : ""}</b></li>`).join("")}</ol>
        <div class="confetti" id="confetti"></div></div>
      ${endBubbles(P.map(x => x.name))}
      <div class="actions"><div class="row"><button class="btn red" id="again">Rejouer</button><button class="btn white" id="home">Accueil</button></div></div>
    `, () => { party(); $("#again").onclick = unoStart; $("#home").onclick = home; bindBubbles(); });
  };
  turn();
}

function startDeux() {
  if (tutoGate("deux", startDeux)) return;
  stat("start", "deux", 2, "un");
  const lv = S.level;
  const qs = DEUX.filter(q => q[0] <= lv && (S.hot || !isHot([q[1]]))).map(q => ({ q, k: Math.random() + (q[0] === lv ? .35 : 0) })).sort((a, b) => b.k - a.k).slice(0, 15).map(o => o.q[1]);
  const st = { i: 0, ok: 0, qs, pts: { [S.duo[0]]: 0, [S.duo[1]]: 0 } };
  keepAwake();
  const ask = () => {
    if (st.i >= st.qs.length) return resultDeux(st);
    view(`
      <div class="topbar">${quitBtn()}<span class="progress">Question ${st.i + 1} / ${st.qs.length}</span><span style="width:44px"></span></div>
      <div class="stage">${cardShell("deux", null, `

      <div class="actions"><button class="btn red" id="go">3, 2, 1… Désignez !</button></div>`, () => {
      bindQuit();
      $("#go").onclick = () => {
        let n = 3;
        $(".actions").innerHTML = "";
        const tick = () => {
          $(".stage").innerHTML = `<div class="big-count">${n > 0 ? n : "Pointez !"}</div>`;
          if (n <= 0) { $(".big-count").style.fontSize = "72px"; buzz(80); later(judge, 800); return; }
          buzz(20); n--; later(tick, 700);
        };
        tick();
      };
    });
  };
  const judge = () => {
    $(".stage").innerHTML = cardShell("deux", null, `<p class="text">Vous avez désigné la même personne ?</p>`, st.i % 2);
    $(".actions").innerHTML = `<div class="row"><button class="btn white" id="no">Non</button><button class="btn green" id="yes">Oui</button></div>`;
    $("#yes").onclick = () => {
      $(".stage").innerHTML = cardShell("deux", null, `<p class="text">Qui était-ce ?</p>
        <div class="row" style="padding:0 18px">${S.duo.map((n, i) => `<button class="btn white" data-i="${i}">${esc(n)}</button>`).join("")}</div>`, st.i % 2);
      $(".actions").innerHTML = "";
      $$(".stage [data-i]").forEach(b => b.onclick = () => { st.ok++; st.pts[S.duo[+b.dataset.i]]++; stamp("Complices", "green"); st.i++; later(ask, 900); });
    };
    $("#no").onclick = () => {
      stamp("Désaccord");
      later(() => {
        $(".stage").innerHTML = cardShell("deux", null, `<p class="text">Chacun a 20 secondes pour défendre sa version.</p>`, st.i % 2);
        $(".actions").innerHTML = `<button class="btn red" id="ok">Question suivante</button>`;
        $("#ok").onclick = () => { st.i++; ask(); };
      }, 900);
    };
  };
  ask();
}
function resultDeux(st) {

  const title = pct >= 80 ? "Âmes sœurs, ou complices du crime" : pct >= 60 ? "Un duo solide" : pct >= 40 ? "Ça se discute" : "Vous vous connaissez vraiment ?";

function roomResolve(r) {
  const { F } = ON.ctx.N, c = r.card, acts = r.acts || {}, pts = {};
  const add = (u, n) => { if (n && r.players[u]) pts[u] = (pts[u] || 0) + n; };
  let res;

    const g = needers(r).filter(u => acts[u] != null).map(u => ({ u, v: acts[u], p: zonePts(Math.abs(acts[u] - c.target)) }));
    g.forEach(o => add(o.u, o.p));

    add(c.giver, gp);

    const did = ids(r).filter(u => acts[u] === "1"); did.forEach(u => add(u, 1)); res = { did };

    const A = ids(r).filter(u => acts[u] === "a"), B = ids(r).filter(u => acts[u] === "b");
    const win = A.length === B.length ? "" : A.length > B.length ? "a" : "b";

    right.forEach(u => add(u, 2)); add(c.ranker, right.length); res = { right, wrong: needers(r).filter(u => acts[u] != null && !right.includes(u)) };

// un jeu présent dans le document remplace entièrement les cartes écrites dans le code
function applyContenu(d) {
  try {
    if (d.cartes) for (const k in d.cartes) if (C[k] && Array.isArray(d.cartes[k]) && d.cartes[k].length) { C[k].length = 0; C[k].push(...d.cartes[k]); }
    if (Array.isArray(d.deux) && d.deux.length) { DEUX.length = 0; DEUX.push(...d.deux); }
    if (d.desc) for (const k in d.desc) if (TYPES[k] && typeof d.desc[k] === "string") TYPES[k].desc = d.desc[k];
    if (Array.isArray(d.levels)) d.levels.forEach((x, i) => { if (LEVELS[i] && x) LEVELS[i].desc = x; });
    if (d.tuto) for (const k in d.tuto) if (d.tuto[k]) TUTO[k] = d.tuto[k];
    store.get("custom", []).forEach(o => { if (C[o.type] && !C[o.type].some(c => cardId(o.type, c) === cardId(o.type, o.card))) C[o.type].push(o.card); });
  } catch (e) {}
}

<script>
// GitHub Pages fait garder l'ancienne page jusqu'à 10 min dans le téléphone : à l'ouverture (et au retour dans l'appli),
// on va chercher la dernière version sans passer par cette mémoire, et on recharge si elle a changé.
// Jamais en pleine partie, ni quand des joueurs sont déjà ajoutés (ils seraient perdus).
(function () {
  if (!/github\.io$/.test(location.hostname) || !window.fetch) return;
  var mine = document.querySelector('meta[name="build"]').content, busy = false;
  var calme = function () {
    try { return !S.inGame && !ON.ctx && !S.names.length; } catch (e) { return false; }
  };
  var check = function () {
    if (busy || document.hidden || !calme()) return;
    busy = true;
    fetch(location.href, { cache: "reload" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
      var m = t.match(/<meta name="build" content="([^"]+)"/), k = "maj-" + (m && m[1]);
      if (!m || m[1] === mine || !calme()) return;
      try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); } catch (e) {}
      location.reload();
    }).catch(function () {}).then(function () { busy = false; });
  };
  setTimeout(check, 300);
  document.addEventListener("visibilitychange", check);
})();
</script>
